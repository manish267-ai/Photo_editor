         timelineContainer.appendChild(row);\n            }\n\n            lucide.createIcons();\n        }\n\n        function renderTextLayersListUI() {\n            const list = document.getElementById('textLayersList');\n            if (state.textLayers.length === 0) {\n                list.innerHTML = `<p class=\"text-xs text-studio-400 italic py-2\">No text overlays added yet.</p>`;\n                return;\n            }\n\n            list.innerHTML = '';\n            state.textLayers.forEach(layer => {\n                const isSelected = layer.id === selectedTextLayerId;\n                const item = document.createElement('div');\n                item.className = `flex items-center justify-between px-3 py-2 rounded-lg border text-xs cursor-pointer transition ${\n                    isSelected ? 'bg-studio-800 border-white text-white' : 'bg-studio-950 border-studio-800 text-studio-300'\n                }`;\n                item.innerHTML = `\n                    <div class=\"flex items-center gap-2 truncate\">\n                        <span class=\"w-3 h-3 rounded-full border border-white/30 shrink-0\" style=\"background:${layer.color}\"></span>\n                        <span class=\"truncate font-medium\">${layer.text}</span>\n                    </div>\n                    <button data-del-id=\"${layer.id}\" class=\"text-studio-400 hover:text-red-400 p-1\">\n                        <i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"></i>\n                    </button>\n                `;\n\n                item.addEventListener('click', (e) => {\n                    if (e.target.closest('[data-del-id]')) return;\n                    selectedTextLayerId = layer.id;\n                    document.getElementById('textInputContent').value = layer.text;\n                    document.getElementById('textFontSelect').value = layer.font;\n                    document.getElementById('textColorPicker').value = layer.color;\n                    document.getElementById('textColorHex').textContent = layer.color.toUpperCase();\n                    document.getElementById('textSizeSlider').value = layer.size;\n                    document.getElementById('textSizeLabel').textContent = `${layer.size}px`;\n                    renderTextLayersListUI();\n                    renderCanvas();\n                });\n\n                item.querySelector('[data-del-id]').addEventListener('click', () => {\n                    state.textLayers = state.textLayers.filter(l => l.id !== layer.id);\n                    if (selectedTextLayerId === layer.id) selectedTextLayerId = null;\n                    renderTextLayersListUI();\n                    renderCanvas();\n                    pushHistory('Deleted Text');\n                });\n\n                list.appendChild(item);\n            });\n            lucide.createIcons();\n        }\n\n        function getCanvasNormalizedCoords(clientX, clientY) {\n            const rect = canvas.getBoundingClientRect();\n            const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));\n            const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));\n            return { x, y };\n        }\n\n        function bindEvents() {\n            const navRail = document.getElementById('toolNavRail');\n            let isNavDragging = false;\n            let navStartX = 0;\n            let navScrollLeft = 0;\n            let navDragMoved = false;\n\n            navRail.addEventListener('mousedown', (e) => {\n                isNavDragging = true;\n                navDragMoved = false;\n                navStartX = e.pageX - navRail.offsetLeft;\n                navScrollLeft = navRail.scrollLeft;\n            });\n            window.addEventListener('mousemove', (e) => {\n                if (!isNavDragging) return;\n                const x = e.pageX - navRail.offsetLeft;\n                const walk = (x - navStartX) * 1.4;\n                if (Math.abs(walk) > 6) navDragMoved = true;\n                navRail.scrollLeft = navScrollLeft - walk;\n            });\n            window.addEventListener('mouseup', () => { isNavDragging = false; });\n\n            document.querySelectorAll('.tool-tab-btn').forEach(btn => {\n                btn.addEventListener('click', (e) => {\n                    if (navDragMoved) {\n                        e.preventDefault();\n                        return;\n                    }\n                    activeTab = btn.dataset.tab;\n                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });\n\n                    document.querySelectorAll('.tool-tab-btn').forEach(b => {\n                        const active = b.dataset.tab === activeTab;\n                        const inner = b.querySelector('.tool-tab-inner');\n                        if (inner) {\n                            inner.className = `tool-tab-inner relative w-full h-14 lg:h-16 rounded-2xl flex flex-col items-center justify-center gap-1 transition-transform duration-150 ${\n                                active ? 'bg-white text-studio-950 shadow-md scale-[1.03]' : 'text-studio-300 hover:text-white hover:bg-studio-800'\n                            }`;\n                        }\n                    });\n\n                    document.querySelectorAll('.tool-panel').forEach(p => p.classList.add('hidden'));\n                    document.getElementById(`panel-${activeTab}`).classList.remove('hidden');\n\n                    const titles = {\n                        adjust: 'Light & Color Adjustments',\n                        tools: 'Tools & Retouch',\n                        filters: 'Studio Preset Filters',\n                        transform: 'Crop & Geometry',\n                        text: 'Typography Overlays',\n                        draw: 'Freehand Brush Tool',\n                        pip: 'Picture-in-Picture',\n                        layers: 'Edit Layers & History'\n                    };\n                    document.getElementById('inspectorTitle').textContent = titles[activeTab];\n\n                    if (activeTab !== 'tools') isPickingBgColor = false;\n                    if (activeTab === 'draw') {\n                        isBrushEnabled = true;\n                        document.getElementById('brushToggleCheckbox').checked = true;\n                    } else {\n                        isBrushEnabled = false;\n                        document.getElementById('brushToggleCheckbox').checked = false;\n                    }\n                    if (activeTab === 'pip') renderPipPanelUI();\n                    updateInteractiveModeHUD();\n                    renderCanvas();\n                });\n            });\n\n            const fileInput = document.getElementById('fileUploadInput');\n            fileInput.addEventListener('change', (e) => {\n                if (e.target.files && e.target.files[0]) handleUploadedFile(e.target.files[0]);\n                fileInput.value = '';\n            });\n\n            const dropOverlay = document.getElementById('dropZoneOverlay');\n            window.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.classList.remove('opacity-0'); });\n            window.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) dropOverlay.classList.add('opacity-0'); });\n            window.addEventListener('drop', (e) => {\n                e.preventDefault();\n                dropOverlay.classList.add('opacity-0');\n                if (e.dataTransfer.files && e.dataTransfer.files[0]) handleUploadedFile(e.dataTransfer.files[0]);\n            });\n\n            document.getElementById('undoBtn').addEventListener('click', undo);\n            document.getElementById('redoBtn').addEventListener('click', redo);\n\n            window.addEventListener('keydown', (e) => {\n                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;\n                if (activeTab === 'pip' && selectedPipId && (e.key 'Flipped Horizontally');\n            });\n            document.getElementById('flipVBtn').addEventListener('click', () => {\n                state.transform.flipV = !state.transform.flipV;\n                renderCanvas();\n                pushHistory('Flipped Vertically');\n            });\n\n            document.querySelectorAll('.aspect-btn').forEach(btn => {\n                btn.addEventListener('click', () => {\n                    state.transform.aspectRatio = btn.dataset.ratio;\n                    syncUIFromState();\n                    renderCanvas();\n                    pushHistory(btn.dataset.ratio === 'custom'\n                        ? `Custom Crop ${state.transform.customW}:${state.transform.customH}`\n                        : `Aspect Ratio ${btn.dataset.ratio}`);\n                });\n            });\n\n            const customWInput = document.getElementById('customCropW');\n            const customHInput = document.getElementById('customCropH');\n            const readCustomRatio = () => {\n                const w = Math.max(1, Math.min(100, Number(customWInput.value) || 1));\n                const h = Math.max(1, Math.min(100, Number(customHInput.value) || 1));\n                state.transform.customW = w;\n                state.transform.customH = h;\n                state.transform.aspectRatio = 'custom';\n                document.getElementById('aspectBadge').textContent = `${w}:${h}`;\n                renderCanvas();\n            };\n            [customWInput, customHInput].forEach(inp => {\n                inp.addEventListener('input', readCustomRatio);\n                inp.addEventListener('change', () => {\n                    readCustomRatio();\n                    syncUIFromState();\n                    pushHistory(`Custom Crop ${state.transform.customW}:${state.transform.customH}`);\n                });\n            });\n            document.getElementById('customCropSwapBtn').addEventListener('click', () => {\n                const t = const frame = document.getElementById('app');
let activeMode = '';
let checking = false;
async function hasInternet() {
  if (!navigator.onLine) return false;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2500);
  try {
    await fetch('https://cdn.tailwindcss.com', { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
    return true;
  } catch (_) {
    return false;
  } finally {
    clearTimeout(timeout);
  }
}
async function selectVersion() {
  if (checking) return;
  checking = true;
  try {
    const online = await hasInternet();
    const mode = online ? 'online' : 'offline';
    if (mode !== activeMode) {
      frame.srcdoc = online ? onlineVersion : offlineVersion;
      activeMode = mode;
    }
  } finally {
    checking = false;
  }
}
window.addEventListener('online', () => setTimeout(selectVersion, 250));
window.addEventListener('offline', () => {
  frame.srcdoc = offlineVersion;
  activeMode = 'offline';
});
// Show the offline app immediately, then switch to the original UI if internet is reachable.
frame.srcdoc = offlineVersion;
activeMode = 'offline';
selectVersion();
</script>
</body>
