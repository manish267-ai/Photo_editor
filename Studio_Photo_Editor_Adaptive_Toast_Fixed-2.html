 values: { brightness: 100, contrast: 110, saturation: 100, exposure: 0, grayscale: 100, sepia: 0, blur: 0, hueRotate: 0, vignette: 0, invert: 100 }\n            },\n            {\n                id: 'lomo',\n                name: 'Lomo Punch',\n                desc: 'Toy-camera saturation',\n                values: { brightness: 104, contrast: 130, saturation: 150, exposure: 0, grayscale: 0, sepia: 10, blur: 0, hueRotate: -8, vignette: 65, invert: 0 }\n            },\n            { id: 'cinema', name: 'Cinema Teal', desc: 'Cool shadows, warm light', values: { brightness: 98, contrast: 122, saturation: 112, exposure: -2, grayscale: 0, sepia: 5, blur: 0, hueRotate: 12, vignette: 28, invert: 0 } },\n            { id: 'portra', name: 'Soft Portrait', desc: 'Gentle skin-friendly warmth', values: { brightness: 108, contrast: 92, saturation: 92, exposure: 7, grayscale: 0, sepia: 12, blur: 0, hueRotate: -4, vignette: 8, invert: 0 } },\n            { id: 'emerald', name: 'Emerald Hour', desc: 'Deep greens and cool air', values: { brightness: 101, contrast: 112, saturation: 125, exposure: 1, grayscale: 0, sepia: 0, blur: 0, hueRotate: -18, vignette: 22, invert: 0 } },\n            { id: 'peach', name: 'Peach Glow', desc: 'Peachy highlights', values: { brightness: 111, contrast: 95, saturation: 116, exposure: 8, grayscale: 0, sepia: 18, blur: 0, hueRotate: -12, vignette: 10, invert: 0 } },\n            { id: 'matte', name: 'Matte Fade', desc: 'Muted, lifted shadows', values: { brightness: 106, contrast: 82, saturation: 78, exposure: 8, grayscale: 0, sepia: 6, blur: 0, hueRotate: 0, vignette: 5, invert: 0 } },\n            { id: 'bluehour', name: 'Blue Hour', desc: 'Twilight blue tones', values: { brightness: 94, contrast: 116, saturation: 108, exposure: -7, grayscale: 0, sepia: 0, blur: 0, hueRotate: 26, vignette: 30, invert: 0 } },\n            { id: 'sunset', name: 'Sunset Film', desc: 'Warm sunset saturation', values: { brightness: 106, contrast: 118, saturation: 138, exposure: 6, grayscale: 0, sepia: 20, blur: 0, hueRotate: -16, vignette: 24, invert: 0 } },\n            { id: 'frost', name: 'Frosted', desc: 'Pale, airy cool tones', values: { brightness: 116, contrast: 88, saturation: 78, exposure: 12, grayscale: 4, sepia: 0, blur: 0, hueRotate: 10, vignette: 0, invert: 0 } },\n            { id: 'street', name: 'Street Grit', desc: 'Hard contrast and punch', values: { brightness: 96, contrast: 155, saturation: 112, exposure: -5, grayscale: 0, sepia: 0, blur: 0, hueRotate: 0, vignette: 48, invert: 0 } },\n            { id: 'rose', name: 'Rose Tint', desc: 'Subtle rosy color cast', values: { brightness: 103, contrast: 104, saturation: 108, exposure: 2, grayscale: 0, sepia: 16, blur: 0, hueRotate: -24, vignette: 12, invert: 0 } },\n            { id: 'clean', name: 'Clean Bright', desc: 'Crisp everyday correction', values: { brightness: 108, contrast: 106, saturation: 108, exposure: 5, grayscale: 0, sepia: 0, blur: 0, hueRotate: 0, vignette: 0, invert: 0 } }\n        ];\n\n        function createDefaultState() {\n            return {\n                adjustments: {\n                    brightness: 100,\n                    contrast: 100,\n                    saturation: 100,\n                    exposure: 0,\n                    grayscale: 0,\n                    sepia: 0,\n                    blur: 0,\n                    hueRotate: 0,\n                    vignette: 0,\n                    invert: 0\n                },\n                disabledAdjustments: {},\n                activePreset: 'original',\n                transform: {\n                    rotation: 0,\n                    flipH: false,\n                    flipV: false,\n                    aspectRatio: 'free',\n                    customW: 4,\n                    customH: 3,\n                    panX: 0,\n                    panY: 0,\n                    zoom: 100,\n                    visible: true\n                },\n                textLayers: [],\n                pipLayers: [],\n                brushStrokes: [],\n                toolOps: []\n            };\n        }\n\n        let state = createDefaultState();\n        let historyStack = [];\n        let historyIndex = -1;\n        const MAX_HISTORY = 35;\n\n        let sourceImage = new Image();\n        sourceImage.crossOrigin = 'anonymous';\n        let isImageLoaded = false;\n\n        const canvas = document.getElementById('editorCanvas');\n        const ctx = canvas.getContext('2d');\n        let activeTab = 'adjust';\n        let isComparingOriginal = false;\n\n        let isBrushEnabled = false;\n        let brushColor = '#ffffff';\n        let brushSize = 12;\n        let brushOpacity = 100;\n        let currentStroke = null;\n        let isDrawingStroke = false;\n\n        let selectedTextLayerId = null;\n        let brushErase = false;\n        let brushMode = 'paint';\n        let brushShapeType = 'rectangle';\n        let brushShapeFill = false;\n        let selectedShapeIndex = -1;\n        let shapeDrag = null;\n        let isPickingBrushColor = false;\n        let brushBlend = 'source-over';\n        let pipImages = {};\n        let savedPipKeys = new Set();\n        let selectedPipId = null;\n        let pipDrag = null;\n        let hideSelection = false;\n        let isDraggingText = false;\n        let dragOffsetNormalized = { x: 0, y: 0 };\n\n        let exportFormat = 'image/jpeg';\n        let exportQuality = 0.92;\n\n        function initApp() {\n            // Ignore track taps. A range only becomes interactive when the user starts on its thumb.\n            // Keep a suppression guard as a fallback for browsers that still emit input after preventDefault().\n            document.addEventListener('pointerdown', (event) => {\n                const slider = event.target.closest('input[type=\"range\"]');\n                if (!slider || slider.disabled || !slider.classList.contains('studio-slider')) return;\n                const rect = slider.getBoundingClientRect();\n                const min = Number(slider.min || 0);\n                const max = Number(slider.max || 100);\n                const value = Number(slider.value || 0);\n                const ratio = max > min ? (value - min) / (max - min) : 0;\n                const thumbRadius = 10;\n                const usableWidth = Math.max(0, rect.width - thumbRadius * 2);\n                const thumbCenter = rect.left + thumbRadius + ratio * usableWidth;\n                if (Math.abs(event.clientX - thumbCenter) > thumbRadius + 2) {\n                    slider.dataset.ignoreTrackTap = '1';\n                    slider.dataset.valueBeforeTap = slider.value;\n                    event.preventDefault();\n                    event.stopPropagation();\n                    event.stopImmediatePropagation();\n                }\n            }, true);\n            document.addEventListener('input', (event) => {\n                const slider = event.target;\n                if (!(slider instanceof HTMLInputElement) || slider.type !== 'range' || slider.dataset.ignoreTrackTap !== '1') return;\n                slider.value = slider.dataset.valueBeforeTap ?? slider.value;\n                event.stopImmediatePropagation();\n            }, true);\n            const clearIgnoredTap = (event) => {\n                const slider = event.target.closest?.('input[type=\"range\"]');\n                if (!slider || slider.dataset.ignoreTrackTap !== '1') return;\n                // Keep the guard through click so delayed native input events cannot move the thumb.\n                if (event.type === 'click') {\n                    delete slider.dataset.ignoreTrackTap;\n                    delete slider.dataset.valueBeforeTap;\n                } else {\n                    setTimeout(() => {\n                        delete slider.dataset.ignoreTrackTap;\n                        delete slider.dataset.valueBeforeTap;\n                    }, 350);\n                }\n            };\n            document.addEventListener('pointerup', clearIgnoredTap, true);\n            document.addEventListener('pointercancel', clearIgnoredTap, true);\n            document.addEventListener('click', clearIgnoredTap, true);\n\n            buildSlidersUI();\n            const presetSearch = document.getElementById('presetSearchInput');\n            if (presetSearch) presetSearch.addEventListener('input', buildPresetsUI);\n            buildPresetsUI();\n            bindEvents();\n            bindTools();\n            bindDrafts();\n            bindExtras();\n            loadCustomFonts().then(initDrafts);\n        }\n\n        // ================= TOOLS (destructive pixel ops on the base image) =================\n        let originalImage = null;\n        let pickRaw = false;\n        let isPickingBgColor = false;\n        let bgMode = 'smart';\n        let bgPickColor = { r: 255, g: 255, b: 255 };\n        let isToolBusy = false;\n        const toolOpBefore = {};\n\n        function canvasToBlob(c, type = 'image/png', quality) {\n            return new Promise((resolve, reject) => {\n                c.toBlob(b => b ? resolve(b) : reject(new Error('Could not encode image')), type, quality);\n            });\n        }\n\n        function loadImageFromBlob(blob) {\n            return new Promise((resolve, reject) => {\n                const url = URL.createObjectURL(blob);\n                const img = new Image();\n                img.onload = () => { img._blob = blob; resolve(img); };\n                img.onerror = () => reject(new Error('Could not load image'));\n                img.src = url;\n            });\n        }\n\n        async function imageToBlob(img) {\n            const c = document.createElement('canvas');\n            c.width = img.naturalWidth || img.width;\n            c.height = img.naturalHeight || img.height;\n            c.getContext('2d').drawImage(img, 0, 0);\n            return canvasToBlob(c);\n        }\n\n        function getSourceCanvas() {\n            const c = document.createElement('canvas');\n            c.width = sourceImage.naturalWidth || sourceImage.width;\n            c.height = sourceImage.naturalHeight || sourceImage.height;\n            c.getContext('2d').drawImage(sourceImage, 0, 0);\n            return c;\n        }\n\n        async function commitSourceCanvas(c, label) {\n            const blob = await canvasToBlob(c);\n            const img = await loadImageFromBlob(blob);\n            const opId = 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);\n            toolOpBefore[opId] = sourceImage;\n            if (!state.toolOps) state.toolOps = [];\n            state.toolOps.push({ id: opId, label });\n            sourceImage = img;\n            syncUIFromState();\n            renderCanvas();\n            pushHistory(label);\n        }\n\n        async function runTool(label, fn) {\n            if (!isImageLoaded) { showToast('Open a photo first'); return; }\n            if (isToolBusy) return;\n            isToolBusy = true;\n            showToast(`${label}...`);\n            try {\n                await new Promise(r => setTimeout(r, 40));\n                const out = fn(getSourceCanvas());\n                await commitSourceCanvas(out, label);\n                showToast(`${label} applied`);\n            } catch (err) {\n                showToast(err.message || `${label} failed`);\n            } finally {\n                isToolBusy = false;\n            }\n        }\n\n        function clamp255(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }\n\n        function removeBackgroundOp(src, keys, tol, feather, connectedOnly) {\n            const w = src.width, h = src.height;\n            const img = src.getContext('2d').getImageData(0, 0, w, h);\n            const d = img.data;\n            const thr = tol * 2.55;\n            const thr2 = thr * thr;\n            const isBg = (p) => {\n                const i = p * 4;\n                if (d[i + 3] < 10) return true;\n                for (let k = 0; k < keys.length; k++) {\n                    const dr = d[i] - keys[k].r, dg = d[i + 1] - keys[k].g, db = d[i + 2] - keys[k].b;\n                    if (dr * dr + dg * dg + db * db <= thr2) return true;\n                }\n                return false;\n            };\n            const bg = new Uint8Array(w * h);\n            if (!connectedOnly) {\n                for (let p = 0; p < w * h; p++) if (isBg(p)) bg[p] = 1;\n            } else {\n                const stack = new Int32Array(w * h);\n                let sp = 0;\n                const push = (p) => { if (!bg[p] && isBg(p)) { bg[p] = 1; stack[sp++] = p; } };\n                for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }\n                for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }\n                while (sp > 0) {\n                    const p = stack[--sp];\n                    const x = p % w;\n                    const y = (p - x) / w;\n                    if (x > 0) push(p - 1);\n                    if (x < w - 1) push(p + 1);\n                    if (y > 0) push(p - w);\n                    if (y < h - 1) push(p + w);\n                }\n            }\n            let removed = 0;\n            for (let p = 0; p < w * h; p++) {\n                if (bg[p]) { d[p * 4 + 3] = 0; removed++; }\n            }\n            if (removed === 0) throw new Error('No background found. Try a higher tolerance or Pick colour.');\n            if (removed === w * h) throw new Error('Everything was removed. Lower the tolerance.');\n\n            const out = document.createElement('canvas');\n            out.width = w; out.height = h;\n            const octx = out.getContext('2d');\n            octx.putImageData(img, 0, 0);\n\n            if (feather > 0) {\n                const maskData = octx.createImageData(w, h);\n                for (let p = 0; p < w * h; p++) maskData.data[p * 4 + 3] = d[p * 4 + 3];\n                const m0 = document.createElement('canvas');\n                m0.width = w; m0.height = h;\n                m0.getContext('2d').putImageData(maskData, 0, 0);\n                const m1 = document.createElement('canvas');\n                m1.width = w; m1.height = h;\n                const m1ctx = m1.getContext('2d');\n                m1ctx.filter = `blur(${feather}px)`;\n                m1ctx.drawImage(m0, 0, 0);\n                octx.globalCompositeOperation = 'destination-in';\n                octx.drawImage(m1, 0, 0);\n                octx.globalCompositeOperation = 'source-over';\n            }\n            return out;\n        }\n\n        function cornerKeyColors(src) {\n            const w = src.width, h = src.height;\n            const ctx = src.getContext('2d');\n            const n = Math.max(1, Math.min(6, Math.floor(Math.min(w, h) / 4)));\n            const spots = [[0, 0], [w - n, 0], [0, h - n], [w - n, h - n]];\n            const keys = [];\n            spots.forEach(([x, y]) => {\n                const dd = ctx.getImageData(x, y, n, n).data;\n                let r = 0, g = 0, b = 0, c = 0;\n                for (let i = 0; i < dd.length; i += 4) {\n                    if (dd[i + 3] < 10) continue;\n                    r += dd[i]; g += dd[i + 1]; b += dd[i + 2]; c++;\n                }\n                if (!c) return;\n                const k = { r: r / c, g: g / c, b: b / c };\n                const dup = keys.some(o => Math.hypot(o.r - k.r, o.g - k.g, o.b - k.b) < 18);\n                if (!dup) keys.push(k);\n            });\n            return keys;\n        }\n\n        function autoEnhanceOp(src) {\n            const w = src.width, h = src.height;\n            const ctx = src.getContext('2d');\n            const img = ctx.getImageData(0, 0, w, h);\n            const d = img.data;\n            const hist = new Uint32Array(256);\n            let total = 0;\n            for (let i = 0; i < d.length; i += 4) {\n                if (d[i + 3] < 10) continue;\n                hist[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])]++;\n                total++;\n            }\n            if (!total) throw new Error('Nothing to enhance');\n            let acc = 0, lo = 0, hi = 255;\n            for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.005) { lo = v; break; } }\n            acc = 0;\n            for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= total * 0.005) { hi = v; break; } }\n            if (hi - lo < 8) throw new Error('Photo is already flat, nothing to stretch');\n            const scale = 255 / (hi - lo);\n            let meanAcc = 0;\n            for (let v = 0; v < 256; v++) meanAcc += hist[v] * Math.max(0, Math.min(255, (v - lo) * scale));\n            const mean = Math.max(20, Math.min(235, meanAcc / total));\n            const gamma = Math.max(0.75, Math.min(1.35, Math.log(0.46) / Math.log(mean / 255)));\n            const lut = new Uint8ClampedArray(256);\n            for (let v = 0; v < 256; v++) {\n                const n = Math.max(0, Math.min(1, ((v - lo) * scale) / 255));\n                lut[v] = Math.round(255 * Math.pow(n, gamma));\n            }\n            for (let i = 0; i < d.length; i += 4) { d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; }\n            ctx.putImageData(img, 0, 0);\n            return src;\n        }\n\n        function sharpenOp(src, amount) {\n            const w = src.width, h = src.height;\n            const ctx = src.getContext('2d');\n            const sharp = ctx.getImageData(0, 0, w, h);\n            const blurC = document.createElement('canvas');\n            blurC.width = w; blurC.height = h;\n            const bctx = blurC.getContext('2d');\n            bctx.filter = 'blur(1.2px)';\n            bctx.drawImage(src, 0, 0);\n            const b = bctx.getImageData(0, 0, w, h).data;\n            const d = sharp.data;\n            for (let i = 0; i < d.length; i += 4) {\n                d[i] = clamp255(d[i] + amount * (d[i] - b[i]));\n                d[i + 1] = clamp255(d[i + 1] + amount * (d[i + 1] - b[i + 1]));\n                d[i + 2] = clamp255(d[i + 2] + amount * (d[i + 2] - b[i + 2]));\n            }\n            ctx.putImageData(sharp, 0, 0);\n            return src;\n        }\n\n        function smoothOp(src, amount) {\n            const w = src.width, h = src.height;\n            const out = document.createElement('canvas');\n            out.width = w; out.height = h;\n            const octx = out.getContext('2d');\n            octx.drawImage(src, 0, 0);\n            octx.globalAlpha = amount;\n            octx.filter = `blur(${Math.max(2, Math.round(Math.max(w, h) / 300))}px)`;\n            octx.drawImage(src, 0, 0);\n            return out;\n        }\n\n        function pixelateOp(src, sizeSlider) {\n            const w = src.width, h = src.height;\n            const block = Math.max(2, Math.round(sizeSlider * Math.max(w, h) / 1000));\n            const sw = Math.max(1, Math.round(w / block));\n            const sh = Math.max(1, Math.round(h / block));\n            const small = document.createElement('canvas');\n            small.width = sw; small.height = sh;\n            small.getContext('2d').drawImage(src, 0, 0, sw, sh);\n            const out = document.createElement('canvas');\n            out.width = w; out.height = h;\n            const octx = out.getContext('2d');\n            octx.imageSmoothingEnabled = false;\n            octx.drawImage(small, 0, 0, sw, sh, 0, 0, w, h);\n            return out;\n        }\n\n        function shapeOp(src, kind, radiusPct) {\n            let sx = 0, sy = 0, sw = src.width, sh = src.height;\n            if (kind === 'circle') {\n                const m = Math.min(sw, sh);\n                sx = (sw - m) / 2; sy = (sh - m) / 2; sw = m; sh = m;\n            }\n            const out = document.createElement('canvas');\n            out.width = sw; out.height = sh;\n            const octx = out.getContext('2d');\n            octx.beginPath();\n            if (kind === 'circle') {\n                octx.arc(sw / 2, sh / 2, sw / 2, 0, Math.PI * 2);\n            } else {\n                const r = Math.min(sw, sh) * (radiusPct / 100);\n                octx.moveTo(r, 0);\n                octx.arcTo(sw, 0, sw, sh, r);\n                octx.arcTo(sw, sh, 0, sh, r);\n                octx.arcTo(0, sh, 0, 0, r);\n                octx.arcTo(0, 0, sw, 0, r);\n                octx.closePath();\n            }\n            octx.clip();\n            octx.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);\n            return out;\n        }\n\n        function borderOp(src, pct, color) {\n            const bw = Math.round((pct / 100) * Math.min(src.width, src.height));\n            if (bw < 1) throw new Error('Border is too thin');\n            const out = document.createElement('canvas');\n            out.width = src.width + bw * 2;\n            out.height = src.height + bw * 2;\n            const octx = out.getContext('2d');\n            octx.fillStyle = color;\n            octx.fillRect(0, 0, out.width, out.height);\n            octx.drawImage(src, bw, bw);\n            return out;\n        }\n\n        function resizeOp(src, nw, nh) {\n            if (!(nw >= 16 && nh >= 16) || nw > 8000 || nh > 8000) throw new Error('Size must be between 16 and 8000 px');\n            const out = document.createElement('canvas');\n            out.width = nw; out.height = nh;\n            const octx = out.getContext('2d');\n            octx.imageSmoothingQuality = 'high';\n            octx.drawImage(src, 0, 0, nw, nh);\n            return out;\n        }\n\n        function updateToolsDimsUI() {\n            const wEl = document.getElementById('resizeW');\n            const hEl = document.getElementById('resizeH');\n            if (!wEl || !isImageLoaded) return;\n            if (document.activeElement === wEl || document.activeElement === hEl) return;\n            wEl.value = sourceImage.naturalWidth || sourceImage.width;\n            hEl.value = sourceImage.naturalHeight || sourceImage.height;\n        }\n\n        function setBgMode(mode) {\n            bgMode = mode;\n            const on = 'py-1.5 px-1 rounded-lg text-[11px] font-semibold bg-white text-studio-950 transition';\n            const off = 'py-1.5 px-1 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition';\n            document.getElementById('bgModeSmartBtn').className = mode === 'smart' ? on : off;\n            document.getElementById('bgModeAutoBtn').className = mode === 'auto' ? on : off;\n            document.getElementById('bgModePickBtn').className = mode === 'pick' ? on : off;\n            document.getElementById('bgSmartInfo').classList.toggle('hidden', mode !== 'smart');\n            document.getElementById('bgColorControls').classList.toggle('hidden', mode === 'smart');\n            document.getElementById('bgPickRow').classList.toggle('hidden', mode !== 'pick');\n            if (mode !== 'pick') { isPickingBgColor = false; updateInteractiveModeHUD(); }\n        }\n\n        let bgRemoverPromise = null;\n        function loadBgRemover() {\n            if (!bgRemoverPromise) {\n                const urls = [\n                    'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm',\n                    'https://esm.sh/@imgly/background-removal@1.5.8'\n                ];\n                bgRemoverPromise = (async () => {\n                    let lastErr = null;\n                    for (const u of urls) {\n                        try {\n                            const mod = await import(u);\n                            const fn = mod.removeBackground || mod.default;\n                            if (typeof fn === 'function') return fn;\n                        } catch (err) { lastErr = err; }\n                    }\n                    throw lastErr || new Error('Could not load the background model');\n                })();\n                bgRemoverPromise.catch(() => { bgRemoverPromise = null; });\n            }\n            return bgRemoverPromise;\n        }\n\n        async function smartRemoveBackground() {\n            if (!isImageLoaded) { showToast('Open a photo first'); return; }\n            if (isToolBusy) return;\n            isToolBusy = true;\n            const status = document.getElementById('bgSmartStatus');\n            const btn = document.getElementById('bgRemoveBtn');\n            const setStatus = (t) => { status.textContent = t; status.classList.toggle('hidden', !t); };\n            btn.disabled = true;\n            try {\n                setStatus('Loading model...');\n                const removeBackground = await loadBgRemover();\n                const srcBlob = await canvasToBlob(getSourceCanvas());\n                setStatus('Preparing...');\n                const outBlob = await removeBackground(srcBlob, {\n                    output: { format: 'image/png' },\n                    progress: (key, current, total) => {\n                        if (total > 0) setStatus(`${String(key).startsWith('fetch') ? 'Downloading model' : 'Processing'} ${Math.round(current / total * 100)}%`);\n                    }\n                });\n                setStatus('Applying...');\n                const cutImg = await loadImageFromBlob(outBlob);\n                const c = document.createElement('canvas');\n                c.width = cutImg.naturalWidth || cutImg.width;\n                c.height = cutImg.naturalHeight || cutImg.height;\n                c.getContext('2d').drawImage(cutImg, 0, 0);\n                await commitSourceCanvas(c, 'Removed Background (Smart)');\n                showToast('Background removed');\n                setStatus('');\n            } catch (err) {\n                setStatus('');\n                showToast('Smart removal failed. Check your internet connection and try again, or use a colour mode.');\n                console.error(err);\n            } finally {\n                btn.disabled = false;\n                isToolBusy = false;\n            }\n        }\n\n        function pickBgColorAt(clientX, clientY) {\n            const rect = canvas.getBoundingClientRect();\n            const x = Math.max(0, Math.min(canvas.width - 1, Math.floor((clientX - rect.left) / rect.width * canvas.width)));\n            const y = Math.max(0, Math.min(canvas.height - 1, Math.floor((clientY - rect.top) / rect.height * canvas.height)));\n            pickRaw = true;\n            renderCanvas();\n            const px = ctx.getImageData(x, y, 1, 1).data;\n            pickRaw = false;\n            renderCanvas();\n            isPickingBgColor = false;\n            updateInteractiveModeHUD();\n            if (px[3] < 10) { showToast('That spot is already transparent'); return; }\n            bgPickColor = { r: px[0], g: px[1], b: px[2] };\n            const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');\n            document.getElementById('bgPickSwatch').style.background = hex;\n            document.getElementById('bgPickHex').textContent = hex.toUpperCase();\n            showToast('Background colour picked');\n        }\n\n        function openNumericValueEditor({ label, min, max, value, suffix = '', step = '1', onApply }) {\n            document.getElementById('numericValueEditor')?.remove();\n            const isPercent = String(suffix).trim() === '%';\n            const backdrop = document.createElement('div');\n            backdrop.id = 'numericValueEditor';\n            backdrop.className = 'numeric-editor-backdrop';\n            backdrop.innerHTML = `\n                <form class=\"numeric-editor-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"numericEditorTitle\">\n                    <div id=\"numericEditorTitle\" class=\"text-sm font-semibold\">Set ${label}</div>\n                    <input class=\"numeric-editor-input\" type=\"number\" inputmode=\"decimal\" step=\"${step}\" value=\"${String(value).replace(/&/g, '&amp;').replace(/\"/g,
