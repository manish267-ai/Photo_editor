<iframe id="app" title="Studio Photo Editor"></iframe>
<script>
const onlineVersion = "<!DOCTYPE html>\n<html lang=\"en\" class=\"dark\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n    <title>Studio Photo Editor</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <script src=\"https://unpkg.com/lucide@latest\"><\/script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\"><\/script>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,600&family=Syne:wght@700&display=swap\" rel=\"stylesheet\">\n    \n    <script>\n        tailwind.config = {\n            darkMode: 'class',\n            theme: {\n                extend: {\n                    fontFamily: {\n                        sans: ['Inter', 'sans-serif'],\n                        mono: ['JetBrains Mono', 'monospace'],\n                        serif: ['Playfair Display', 'serif'],\n                        display: ['Syne', 'sans-serif'],\n                    },\n                    colors: {\n                        studio: {\n                            950: '#070708',\n                            900: '#0c0c0e',\n                            850: '#121215',\n                            800: '#18181c',\n                            700: '#27272d',\n                            600: '#3f3f46',\n                            400: '#a1a1aa',\n                            100: '#f4f4f5',\n                        }\n                    }\n                }\n            }\n        }\n    <\/script>\n\n    <style>\n        ::-webkit-scrollbar {\n            width: 5px;\n            height: 5px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #0c0c0e;\n        }\n        ::-webkit-scrollbar-thumb {\n            background: #27272d;\n            border-radius: 9999px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #52525b;\n        }\n\n        /* Monochrome Range Slider */\n        input[type=\"range\"].studio-slider {\n            -webkit-appearance: none;\n            appearance: none;\n            width: 100%;\n            height: 4px;\n            background: #27272d;\n            border-radius: 999px;\n            outline: none;\n            cursor: pointer;\n        }\n        input[type=\"range\"].studio-slider::-webkit-slider-thumb {\n            -webkit-appearance: none;\n            appearance: none;\n            width: 14px;\n            height: 14px;\n            border-radius: 50%;\n            background: #ffffff;\n            border: 2px solid #09090b;\n            box-shadow: 0 0 0 1px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.5);\n            cursor: pointer;\n            transition: transform 0.12s ease, background-color 0.12s ease;\n        }\n        input[type=\"range\"].studio-slider::-webkit-slider-thumb:hover {\n            transform: scale(1.18);\n            background: #f4f4f5;\n        }\n        input[type=\"range\"].studio-slider::-moz-range-thumb {\n            width: 14px;\n            height: 14px;\n            border-radius: 50%;\n            background: #ffffff;\n            border: 2px solid #09090b;\n            box-shadow: 0 0 0 1px rgba(255,255,255,0.4);\n            cursor: pointer;\n            transition: transform 0.12s ease;\n        }\n\n        .slider-val-btn, .editable-slider-value, .pv { cursor: text; border-radius: 4px; }\n        .slider-val-btn:hover, .editable-slider-value:hover, .pv:hover { text-decoration: underline; text-decoration-style: dotted; }\n        #inspectorScrollContent { padding-right: 16px; }\n\n        .numeric-editor-backdrop { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.72); backdrop-filter: blur(5px); }\n        .numeric-editor-card { width: min(100%, 340px); border: 1px solid #303038; border-radius: 18px; padding: 18px; background: #111114; color: #f4f4f5; box-shadow: 0 24px 80px rgba(0,0,0,.55); }\n        .numeric-editor-input { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid #3f3f46; background: #08080a; color: #fff; font: 500 16px 'JetBrains Mono', monospace; outline: none; }\n        .numeric-editor-input:focus { border-color: #a1a1aa; }\n        .numeric-editor-input.invalid { color: #f87171; border-color: #ef4444; }\n        .numeric-editor-confirm:disabled { background: #27272a !important; color: #71717a !important; cursor: not-allowed; box-shadow: none; opacity: .85; }\n\n        /* Transparency Checkerboard for Canvas */\n        .canvas-checkerboard {\n            background-color: #0c0c0e;\n            background-image: \n                linear-gradient(45deg, #141418 25%, transparent 25%), \n                linear-gradient(-45deg, #141418 25%, transparent 25%), \n                linear-gradient(45deg, transparent 75%, #141418 75%), \n                linear-gradient(-45deg, transparent 75%, #141418 75%);\n            background-size: 20px 20px;\n            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;\n        }\n\n        /* Subtle Dot Grid for Workspace */\n        .studio-workspace-bg {\n            background-color: #070708;\n            background-image: radial-gradient(#1f1f26 1px, transparent 1px);\n            background-size: 20px 20px;\n        }\n\n        body {\n            overscroll-behavior: none;\n            user-select: none;\n            -webkit-user-select: none;\n        }\n\n        .no-scrollbar::-webkit-scrollbar {\n            display: none !important;\n            width: 0 !important;\n            height: 0 !important;\n        }\n        .no-scrollbar {\n            -ms-overflow-style: none !important;\n            scrollbar-width: none !important;\n        }\n    </style>\n</head>\n<body class=\"bg-studio-950 text-studio-100 font-sans h-screen w-screen overflow-hidden flex flex-col\">\n\n    <!-- ================= STREAMING_CHUNK:Rendering Top Header Bar ================= -->\n    <header class=\"h-14 bg-studio-900/95 backdrop-blur border-b border-studio-800 px-3 lg:px-5 flex items-center justify-between gap-2 shrink-0 z-30\">\n        <!-- Left File Upload Icon Only -->\n        <div class=\"flex items-center gap-2 shrink-0\">\n            <div class=\"flex items-center gap-1.5\">\n                <button id=\"draftsToggleBtn\" type=\"button\" class=\"relative flex items-center justify-center w-9 h-9 rounded-lg bg-studio-800 hover:bg-studio-700 text-studio-100 border border-studio-700/80 transition\" title=\"Drafts\">\n                    <i data-lucide=\"images\" class=\"w-4 h-4\"></i>\n                    <span id=\"draftsCountBadge\" class=\"hidden absolute -top-1 -right-1 min-w-[16px] h-[16px] px-1 rounded-full bg-white text-studio-950 font-mono text-[10px] font-bold flex items-center justify-center\">0</span>\n                </button>\n                <label for=\"fileUploadInput\" class=\"cursor-pointer flex items-center justify-center w-9 h-9 rounded-lg bg-studio-800 hover:bg-studio-700 text-studio-100 border border-studio-700/80 transition\" title=\"Open Image\">\n                    <i data-lucide=\"upload\" class=\"w-4 h-4\"></i>\n                </label>\n                <input id=\"fileUploadInput\" type=\"file\" accept=\"image/*\" class=\"hidden\">\n            </div>\n            <span id=\"imageMetaLabel\" class=\"text-[11px] font-mono text-studio-400 hidden lg:inline-block ml-1\">1600 × 1067 px</span>\n        </div>\n\n        <!-- Center History Controls (Hold Compare removed from here) -->\n        <div class=\"flex items-center gap-1 sm:gap-1.5 bg-studio-950 p-1 rounded-xl border border-studio-800 shrink-0\">\n            <button id=\"undoBtn\" disabled class=\"p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg text-xs font-medium text-studio-300 hover:text-white hover:bg-studio-800 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1\" title=\"Undo (Ctrl+Z)\">\n                <i data-lucide=\"undo-2\" class=\"w-3.5 h-3.5\"></i>\n                <span class=\"hidden lg:inline\">Undo</span>\n            </button>\n            <button id=\"redoBtn\" disabled class=\"p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg text-xs font-medium text-studio-300 hover:text-white hover:bg-studio-800 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1\" title=\"Redo (Ctrl+Y)\">\n                <i data-lucide=\"redo-2\" class=\"w-3.5 h-3.5\"></i>\n                <span class=\"hidden lg:inline\">Redo</span>\n            </button>\n            <button id=\"compareBtn\" class=\"p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg text-studio-300 hover:text-white hover:bg-studio-800 transition flex items-center justify-center\" title=\"Hold to compare before and after\" aria-label=\"Compare before and after\">\n                <i data-lucide=\"split-square-horizontal\" class=\"w-4 h-4\"></i>\n            </button>\n            <div class=\"h-4 w-[1px] bg-studio-800 mx-0.5\"></div>\n            <button id=\"resetAllBtn\" class=\"p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg text-xs font-medium text-studio-400 hover:text-red-400 hover:bg-studio-800 transition flex items-center gap-1\" title=\"Reset All Edits\">\n                <i data-lucide=\"rotate-ccw\" class=\"w-3.5 h-3.5\"></i>\n                <span class=\"hidden xl:inline\">Reset</span>\n            </button>\n        </div>\n\n        <!-- Right Export Photo Icon-Only Button (Opens Export Modal) -->\n        <div class=\"flex items-center gap-1.5 shrink-0\">\n            <button id=\"openExportModalBtn\" class=\"flex items-center justify-center w-9 h-9 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-studio-950 transition shadow-sm\" title=\"Export Photo Settings\">\n                <i data-lucide=\"download\" class=\"w-4 h-4\"></i>\n            </button>\n        </div>\n    </header>\n\n    <!-- ================= STREAMING_CHUNK:Rendering Main Workspace & Canvas ================= -->\n    <div class=\"flex-1 flex flex-col lg:flex-row overflow-hidden relative\">\n\n        <!-- SLIDABLE BOTTOM NAVIGATION BAR (4 FEATURES VISIBLE AT A TIME, SCALED HIGHER, NO SCROLLBAR) -->\n        <nav id=\"toolNavRail\" class=\"order-3 lg:order-1 h-20 lg:h-auto lg:w-24 bg-studio-900 border-t lg:border-t-0 lg:border-r border-studio-800 flex flex-row lg:flex-col items-center justify-start overflow-x-auto lg:overflow-x-hidden lg:overflow-y-auto no-scrollbar snap-x snap-mandatory lg:py-3 shrink-0 z-20 select-none cursor-grab active:cursor-grabbing\">\n            <button data-tab=\"adjust\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Light & Color Adjustments\">\n                <div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl bg-white text-studio-950 flex flex-col items-center justify-center gap-1 shadow-md transition-transform duration-150 scale-100\">\n                    <i data-lucide=\"sliders-horizontal\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Adjust</span>\n                </div>\n            </button>\n            <button data-tab=\"tools\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Retouch & Utility Tools\">\n                <div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\">\n                    <i data-lucide=\"wrench\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Tools</span>\n                </div>\n            </button>\n            <button data-tab=\"filters\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Studio Preset Filters\">\n                <div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\">\n                    <i data-lucide=\"sparkles\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Presets</span>\n                </div>\n            </button>\n            <button data-tab=\"transform\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Crop & Geometry\">\n                <div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\">\n                    <i data-lucide=\"crop\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Crop</span>\n                </div>\n            </button>\n            <button data-tab=\"text\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Typography Overlays\">\n                <div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\">\n                    <i data-lucide=\"type\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Text</span>\n                </div>\n            </button>\n            <button data-tab=\"draw\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Freehand Brush\">\n                <div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\">\n                    <i data-lucide=\"brush\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Brush</span>\n                </div>\n            </button>\n            <button data-tab=\"pip\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition\" title=\"Picture-in-Picture\"><div class=\"tool-tab-inner w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\"><i data-lucide=\"picture-in-picture-2\" class=\"w-5 h-5\"></i><span class=\"text-[11px] font-semibold tracking-tight\">PIP</span></div></button>\n            <button data-tab=\"layers\" class=\"tool-tab-btn snap-start shrink-0 basis-1/4 min-w-[25%] lg:basis-auto lg:min-w-0 lg:w-full px-1.5 py-2 lg:py-3 flex flex-col items-center justify-center transition relative\" title=\"Edit Layers & History Stack\">\n                <div class=\"tool-tab-inner relative w-full h-14 lg:h-16 rounded-2xl text-studio-300 hover:text-white hover:bg-studio-800 flex flex-col items-center justify-center gap-1 transition-transform duration-150\">\n                    <i data-lucide=\"layers\" class=\"w-5 h-5\"></i>\n                    <span class=\"text-[11px] font-semibold tracking-tight\">Layers</span>\n                    <span id=\"layerCountBadge\" class=\"hidden absolute top-1.5 right-3 min-w-[16px] h-[16px] px-1 rounded-full bg-white text-studio-950 font-mono text-[10px] font-bold flex items-center justify-center shadow\">0</span>\n                </div>\n            </button>\n        </nav>\n\n        <!-- CENTER INTERACTIVE CANVAS STAGE -->\n        <main id=\"canvasWorkspace\" class=\"order-1 lg:order-2 flex-1 studio-workspace-bg relative flex items-center justify-center overflow-hidden p-3 sm:p-6 lg:p-10 select-none\">\n            \n            <!-- Empty State -->\n            <div id=\"emptyState\" class=\"absolute inset-0 z-10 flex flex-col items-center justify-center text-center p-6 gap-3\">\n                <div class=\"w-16 h-16 rounded-2xl bg-studio-800 border border-studio-700 flex items-center justify-center\">\n                    <i data-lucide=\"image-plus\" class=\"w-7 h-7 text-white\"></i>\n                </div>\n                <div class=\"text-sm font-semibold text-white\">Open a photo to start editing</div>\n                <p class=\"text-xs text-studio-400 max-w-xs\">Your progress on every photo is saved automatically as a draft.</p>\n                <label for=\"fileUploadInput\" class=\"cursor-pointer px-4 py-2 rounded-xl bg-white hover:bg-zinc-200 text-studio-950 text-xs font-semibold transition shadow-md\">Choose Image</label>\n                <span class=\"text-[11px] text-studio-400\">or drop an image anywhere</span>\n            </div>\n\n            <!-- Drag & Drop Overlay -->\n            <div id=\"dropZoneOverlay\" class=\"pointer-events-none opacity-0 transition-opacity duration-200 absolute inset-4 rounded-2xl border-2 border-dashed border-white/60 bg-studio-950/80 backdrop-blur-sm z-40 flex flex-col items-center justify-center\">\n                <div class=\"w-14 h-14 rounded-2xl bg-white text-studio-950 flex items-center justify-center mb-3 shadow-lg\">\n                    <i data-lucide=\"file-up\" class=\"w-7 h-7\"></i>\n                </div>\n                <p class=\"text-base font-semibold text-white\">Drop image anywhere to open</p>\n                <p class=\"text-xs text-studio-400 mt-1\">Supports PNG, JPG, WEBP, SVG</p>\n            </div>\n\n            <!-- Original Comparison Badge -->\n            <div id=\"compareBadge\" class=\"hidden absolute top-4 left-1/2 -translate-x-1/2 z-30 px-3 py-1 rounded-full bg-white text-studio-950 font-mono text-[11px] font-semibold tracking-wider uppercase shadow-lg\">\n                Original (Before Edits)\n            </div>\n\n            <!-- Interactive Mode Floating Pill -->\n            <div id=\"modeStatusPill\" class=\"hidden absolute top-4 left-4 z-30 px-3 py-1.5 rounded-full bg-studio-900/90 border border-studio-700 text-studio-100 text-xs flex items-center gap-2 backdrop-blur-md shadow-lg\">\n                <span class=\"w-2 h-2 rounded-full bg-white animate-pulse\"></span>\n                <span id=\"modeStatusText\"></span>\n            </div>\n\n            <!-- Main Canvas Container -->\n            <div id=\"canvasWrapper\" class=\"relative flex items-center justify-center max-w-full max-h-full shadow-[0_25px_70px_-15px_rgba(0,0,0,0.85)] ring-1 ring-white/10 rounded-sm overflow-hidden canvas-checkerboard transition-transform duration-150\">\n                <canvas id=\"editorCanvas\" class=\"block max-w-full max-h-[46vh] lg:max-h-[calc(100vh-9rem)] w-auto h-auto object-contain cursor-default\"></canvas>\n            </div>\n\n            <!-- Bottom-Left Canvas HUD Info -->\n            <div class=\"absolute bottom-3 left-3 z-20 flex items-center gap-1.5 bg-studio-900/90 backdrop-blur-md border border-studio-800 px-2.5 py-1 rounded-lg text-[11px] font-mono text-studio-400\">\n                <span id=\"aspectBadge\">FREE</span>\n                <span>•</span>\n                <span id=\"canvasResolutionHud\">1600×1067</span>\n            </div>\n        </main>\n\n        <!-- RIGHT INSPECTOR DRAWER (Export Bar Removed From Bottom) -->\n        <aside class=\"order-2 lg:order-3 h-[38vh] lg:h-auto lg:w-80 xl:w-88 bg-studio-900 border-t lg:border-t-0 lg:border-l border-studio-800 flex flex-col shrink-0 z-20 overflow-hidden\">\n            \n            <!-- Inspector Header -->\n            <div class=\"px-4 py-3 border-b border-studio-800 flex items-center justify-between shrink-0\">\n                <div class=\"flex items-center gap-2\">\n                    <span id=\"inspectorTitle\" class=\"text-xs font-semibold uppercase tracking-wider text-white\">Adjustments</span>\n                </div>\n                <button id=\"resetSectionBtn\" class=\"text-[11px] font-mono text-studio-400 hover:text-white transition\">\n                    Reset Panel\n                </button>\n            </div>\n\n            <!-- Inspector Scrollable Content Panels -->\n            <div id=\"inspectorScrollContent\" class=\"flex-1 overflow-y-auto p-4 space-y-5\">\n\n                <!-- 1. ADJUSTMENTS PANEL -->\n                <div id=\"panel-adjust\" class=\"tool-panel space-y-4\">\n                    <div id=\"slidersContainer\" class=\"space-y-4\"></div>\n                </div>\n\n                <!-- 1B. TOOLS PANEL -->\n                <div id=\"panel-tools\" class=\"tool-panel hidden space-y-4\">\n\n                <!-- Background removal -->\n                <div class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"eraser\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Remove Background</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\"><b class=\"text-studio-300\">Smart</b> finds the subject and cuts out everything behind it, even busy backgrounds. <b class=\"text-studio-300\">Colour</b> modes only erase a flat colour. Export as PNG to keep transparency.</p>\n                    </div>\n\n                    <div class=\"grid grid-cols-3 gap-1 p-1 rounded-xl bg-studio-950 border border-studio-800\">\n                        <button id=\"bgModeSmartBtn\" type=\"button\" class=\"py-1.5 px-1 rounded-lg text-[11px] font-semibold bg-white text-studio-950 transition\">Smart</button>\n                        <button id=\"bgModeAutoBtn\" type=\"button\" class=\"py-1.5 px-1 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition\">Auto colour</button>\n                        <button id=\"bgModePickBtn\" type=\"button\" class=\"py-1.5 px-1 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition\">Pick colour</button>\n                    </div>\n                    <div id=\"bgSmartInfo\" class=\"space-y-1.5\">\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Runs a model inside your browser, so there is no API key and your photo is not uploaded. The first use downloads the model (roughly 40 to 80 MB), then it is cached.</p>\n                        <p id=\"bgSmartStatus\" class=\"hidden text-[11px] font-mono text-amber-300\"></p>\n                    </div>\n                    <div id=\"bgPickRow\" class=\"hidden flex items-center gap-2\">\n                        <button id=\"bgPickBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition flex-1\"><i data-lucide=\"pipette\" class=\"w-3.5 h-3.5\"></i><span>Pick from image</span></button>\n                        <span id=\"bgPickSwatch\" class=\"w-8 h-8 rounded-lg border border-studio-600\" style=\"background:#ffffff\"></span>\n                        <span id=\"bgPickHex\" class=\"text-[11px] font-mono text-studio-300\">#FFFFFF</span>\n                    </div>\n                    <div id=\"bgColorControls\" class=\"hidden space-y-3\">\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Tolerance</span><span id=\"bgTolVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"bgTol\" data-val-label=\"bgTolVal\" data-suffix=\"\" type=\"range\" min=\"1\" max=\"100\" value=\"30\" class=\"studio-slider\">\n                    </div>\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Edge softness</span><span id=\"bgFeatherVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"bgFeather\" data-val-label=\"bgFeatherVal\" data-suffix=\" px\" type=\"range\" min=\"0\" max=\"10\" value=\"1\" class=\"studio-slider\">\n                    </div>\n\n                    <label class=\"flex items-center gap-2 cursor-pointer\">\n                        <input id=\"bgConnectedOnly\" type=\"checkbox\" checked class=\"rounded bg-studio-950 border-studio-700 text-white focus:ring-0\">\n                        <span class=\"text-[11px] text-studio-300\">Only remove areas connected to the edges</span>\n                    </label>\n                    </div>\n                    <button id=\"bgRemoveBtn\" type=\"button\" class=\"w-full py-2 px-3 rounded-lg bg-white hover:bg-zinc-200 text-studio-950 font-semibold text-xs flex items-center justify-center gap-1.5 transition disabled:opacity-50\"><i data-lucide=\"eraser\" class=\"w-4 h-4\"></i><span>Remove Background</span></button>\n                </div>\n\n                <!-- Enhance -->\n                <div class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"wand\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Enhance</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">One-tap clean-up for flat or dull photos.</p>\n                    </div>\n\n                    <button id=\"autoEnhanceBtn\" type=\"button\" style=\"display:none\" class=\"hidden w-full py-2 px-3 rounded-lg bg-white hover:bg-zinc-200 text-studio-950 font-semibold text-xs flex items-center justify-center gap-1.5 transition disabled:opacity-50\"><i data-lucide=\"sparkles\" class=\"w-4 h-4\"></i><span>Auto Enhance</span></button>\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Sharpen amount</span><span id=\"sharpenAmtVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"sharpenAmt\" data-val-label=\"sharpenAmtVal\" data-suffix=\"%\" type=\"range\" min=\"10\" max=\"200\" value=\"80\" class=\"studio-slider\">\n                    </div>\n\n                    <button id=\"sharpenBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition w-full\"><i data-lucide=\"triangle\" class=\"w-3.5 h-3.5\"></i><span>Apply Sharpen</span></button>\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Smooth amount</span><span id=\"smoothAmtVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"smoothAmt\" data-val-label=\"smoothAmtVal\" data-suffix=\"%\" type=\"range\" min=\"10\" max=\"100\" value=\"50\" class=\"studio-slider\">\n                    </div>\n\n                    <button id=\"smoothBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition w-full\"><i data-lucide=\"droplet\" class=\"w-3.5 h-3.5\"></i><span>Apply Smooth / Soften</span></button>\n                </div>\n\n                <!-- Effects -->\n                <div class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"grid-3x3\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Pixelate</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Chunky mosaic look.</p>\n                    </div>\n\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Block size</span><span id=\"pixelSizeVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"pixelSize\" data-val-label=\"pixelSizeVal\" data-suffix=\"\" type=\"range\" min=\"2\" max=\"60\" value=\"12\" class=\"studio-slider\">\n                    </div>\n\n                    <button id=\"pixelateBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition w-full\"><i data-lucide=\"grid-3x3\" class=\"w-3.5 h-3.5\"></i><span>Apply Pixelate</span></button>\n                </div>\n\n                <!-- Shape (hidden from the main tools list) -->\n                <div id=\"shapeCropToolCard\" class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3 hidden\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"circle\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Shape Crop</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Cut the photo into a circle or rounded corners with transparent edges.</p>\n                    </div>\n\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Corner roundness</span><span id=\"roundRadiusVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"roundRadius\" data-val-label=\"roundRadiusVal\" data-suffix=\"%\" type=\"range\" min=\"5\" max=\"50\" value=\"20\" class=\"studio-slider\">\n                    </div>\n\n                    <div class=\"grid grid-cols-2 gap-2\">\n                        <button id=\"shapeCircleBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition\"><i data-lucide=\"circle\" class=\"w-3.5 h-3.5\"></i><span>Circle</span></button>\n                        <button id=\"shapeRoundBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition\"><i data-lucide=\"square\" class=\"w-3.5 h-3.5\"></i><span>Rounded</span></button>\n                    </div>\n                </div>\n\n                <!-- Border (hidden from the main tools list) -->\n                <div id=\"borderToolCard\" class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3 hidden\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"frame\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Add Border</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Adds a solid frame around the image.</p>\n                    </div>\n\n                    <div>\n                        <div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">Thickness</span><span id=\"borderWidthVal\" class=\"font-mono text-white\"></span></div>\n                        <input id=\"borderWidth\" data-val-label=\"borderWidthVal\" data-suffix=\"%\" type=\"range\" min=\"1\" max=\"25\" value=\"4\" class=\"studio-slider\">\n                    </div>\n\n                    <div class=\"flex items-center gap-2\">\n                        <span class=\"text-xs text-studio-400\">Colour</span>\n                        <input id=\"borderColor\" type=\"color\" value=\"#ffffff\" class=\"w-8 h-7 rounded bg-transparent border-0 cursor-pointer\">\n                        <button id=\"borderBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition flex-1\"><i data-lucide=\"frame\" class=\"w-3.5 h-3.5\"></i><span>Add Border</span></button>\n                    </div>\n                </div>\n\n                <!-- Resize -->\n                <div class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"scaling\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Resize Image</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Scale the base image to exact pixel dimensions.</p>\n                    </div>\n\n                    <div class=\"flex items-center gap-2\">\n                        <input id=\"resizeW\" type=\"number\" min=\"16\" max=\"8000\" class=\"w-full px-3 py-2 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white font-mono text-center focus:outline-none focus:border-white\">\n                        <span class=\"text-studio-400 font-mono\">×</span>\n                        <input id=\"resizeH\" type=\"number\" min=\"16\" max=\"8000\" class=\"w-full px-3 py-2 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white font-mono text-center focus:outline-none focus:border-white\">\n                    </div>\n                    <label class=\"flex items-center gap-2 cursor-pointer\">\n                        <input id=\"resizeLock\" type=\"checkbox\" checked class=\"rounded bg-studio-950 border-studio-700 text-white focus:ring-0\">\n                        <span class=\"text-[11px] text-studio-300\">Lock aspect ratio</span>\n                    </label>\n                    <button id=\"resizeBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition w-full\"><i data-lucide=\"scaling\" class=\"w-3.5 h-3.5\"></i><span>Apply Resize</span></button>\n                </div>\n\n                <!-- Stickers (hidden from the main tools list) -->\n                <div id=\"emojiStickerToolCard\" class=\"p-3.5 rounded-xl bg-studio-850 border border-studio-800 space-y-3 hidden\">\n                    <div class=\"space-y-1\">\n                        <div class=\"flex items-center gap-2\"><i data-lucide=\"smile\" class=\"w-4 h-4 text-white\"></i><span class=\"text-xs font-semibold text-white\">Emoji Stickers</span></div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Tap to drop a sticker, then drag it on the canvas (Text tab).</p>\n                    </div>\n\n                    <div class=\"grid grid-cols-6 gap-1.5\"><button type=\"button\" data-emoji=\"😀\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">😀</button><button type=\"button\" data-emoji=\"😍\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">😍</button><button type=\"button\" data-emoji=\"😎\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">😎</button><button type=\"button\" data-emoji=\"🔥\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">🔥</button><button type=\"button\" data-emoji=\"⭐\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">⭐</button><button type=\"button\" data-emoji=\"❤️\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">❤️</button><button type=\"button\" data-emoji=\"👍\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">👍</button><button type=\"button\" data-emoji=\"🎉\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">🎉</button><button type=\"button\" data-emoji=\"✨\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">✨</button><button type=\"button\" data-emoji=\"🌈\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">🌈</button><button type=\"button\" data-emoji=\"💯\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">💯</button><button type=\"button\" data-emoji=\"📍\" class=\"emoji-btn h-9 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-lg transition\">📍</button></div>\n                </div>\n\n                <!-- Revert -->\n                <button id=\"revertBaseBtn\" type=\"button\" class=\"py-2 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition w-full\"><i data-lucide=\"history\" class=\"w-3.5 h-3.5\"></i><span>Revert image to original upload</span></button>\n                </div>\n\n                <!-- 2. PRESET FILTERS PANEL -->\n                <div id=\"panel-filters\" class=\"tool-panel hidden space-y-3\">\n                    <p class=\"text-xs text-studio-400\">Choose a look, then fine-tune the sliders.</p>\n                    <div class=\"relative\">\n                        <i data-lucide=\"search\" class=\"w-4 h-4 text-studio-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none\"></i>\n                        <input id=\"presetSearchInput\" type=\"search\" placeholder=\"Search presets…\" class=\"w-full pl-9 pr-3 py-2.5 rounded-xl bg-studio-950 border border-studio-700 text-xs text-white placeholder:text-studio-500 focus:outline-none focus:border-studio-500\">\n                    </div>\n                    <div id=\"presetsGrid\" class=\"grid grid-cols-2 gap-2.5\"></div>\n                    <p id=\"presetSearchEmpty\" class=\"hidden text-xs text-studio-500 text-center py-4\">No matching presets.</p>\n                </div>\n\n                <!-- 3. TRANSFORM & CROP PANEL -->\n                <div id=\"panel-transform\" class=\"tool-panel hidden space-y-5\">\n                    <div>\n                        <label class=\"block text-[11px] font-mono uppercase tracking-wider text-studio-400 mb-2.5\">Orientation & Mirror</label>\n                        <div class=\"grid grid-cols-2 gap-2\">\n                            <button id=\"rotateLeftBtn\" class=\"flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-studio-850 hover:bg-studio-800 border border-studio-700/80 text-xs font-medium text-white transition\">\n                                <i data-lucide=\"rotate-ccw\" class=\"w-4 h-4\"></i>\n                                <span>Rotate -90°</span>\n                            </button>\n                            <button id=\"rotateRightBtn\" class=\"flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-studio-850 hover:bg-studio-800 border border-studio-700/80 text-xs font-medium text-white transition\">\n                                <i data-lucide=\"rotate-cw\" class=\"w-4 h-4\"></i>\n                                <span>Rotate +90°</span>\n                            </button>\n                            <button id=\"flipHBtn\" class=\"flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-studio-850 hover:bg-studio-800 border border-studio-700/80 text-xs font-medium text-white transition\">\n                                <i data-lucide=\"flip-horizontal-2\" class=\"w-4 h-4\"></i>\n                                <span>Flip Horiz</span>\n                            </button>\n                            <button id=\"flipVBtn\" class=\"flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-studio-850 hover:bg-studio-800 border border-studio-700/80 text-xs font-medium text-white transition\">\n                                <i data-lucide=\"flip-vertical-2\" class=\"w-4 h-4\"></i>\n                                <span>Flip Vert</span>\n                            </button>\n                        </div>\n                    </div>\n\n                    <div class=\"border-t border-studio-800 pt-4\">\n                        <label class=\"block text-[11px] font-mono uppercase tracking-wider text-studio-400 mb-2.5\">Aspect Ratio Crop</label>\n                        <div class=\"grid grid-cols-3 gap-2\" id=\"aspectRatioGroup\">\n                            <button data-ratio=\"free\" class=\"aspect-btn py-2 px-2.5 rounded-xl bg-white text-studio-950 font-semibold text-xs border border-white transition flex flex-col items-center gap-1\">\n                                <i data-lucide=\"maximize\" class=\"w-3.5 h-3.5\"></i>\n                                <span>Original</span>\n                            </button>\n                            <button data-ratio=\"1:1\" class=\"aspect-btn py-2 px-2.5 rounded-xl bg-studio-850 hover:bg-studio-800 text-studio-300 text-xs border border-studio-700/80 transition flex flex-col items-center gap-1\">\n                                <i data-lucide=\"square\" class=\"w-3.5 h-3.5\"></i>\n                                <span>1 : 1</span>\n                            </button>\n                            <button data-ratio=\"16:9\" class=\"aspect-btn py-2 px-2.5 rounded-xl bg-studio-850 hover:bg-studio-800 text-studio-300 text-xs border border-studio-700/80 transition flex flex-col items-center gap-1\">\n                                <i data-lucide=\"rectangle-horizontal\" class=\"w-3.5 h-3.5\"></i>\n                                <span>16 : 9</span>\n                            </button>\n                            <button data-ratio=\"4:3\" class=\"aspect-btn py-2 px-2.5 rounded-xl bg-studio-850 hover:bg-studio-800 text-studio-300 text-xs border border-studio-700/80 transition flex flex-col items-center gap-1\">\n                                <i data-lucide=\"tv\" class=\"w-3.5 h-3.5\"></i>\n                                <span>4 : 3</span>\n                            </button>\n                            <button data-ratio=\"9:16\" class=\"aspect-btn py-2 px-2.5 rounded-xl bg-studio-850 hover:bg-studio-800 text-studio-300 text-xs border border-studio-700/80 transition flex flex-col items-center gap-1\">\n                                <i data-lucide=\"smartphone\" class=\"w-3.5 h-3.5\"></i>\n                                <span>9 : 16</span>\n                            </button>\n                            <button data-ratio=\"4:5\" class=\"aspect-btn py-2 px-2.5 rounded-xl bg-studio-850 hover:bg-studio-800 text-studio-300 text-xs border border-studio-700/80 transition flex flex-col items-center gap-1\">\n                                <i data-lucide=\"frame\" class=\"w-3.5 h-3.5\"></i>\n                                <span>4 : 5</span>\n                            </button>\n                            <button data-ratio=\"custom\" class=\"aspect-btn col-span-3 py-2 px-2.5 rounded-xl bg-studio-850 hover:bg-studio-800 text-studio-300 text-xs border border-studio-700/80 transition flex flex-row items-center justify-center gap-2\">\n                                <i data-lucide=\"crop\" class=\"w-3.5 h-3.5\"></i>\n                                <span>Custom</span>\n                            </button>\n                        </div>\n                        <div id=\"customCropControls\" class=\"hidden mt-3 p-3 rounded-xl bg-studio-850 border border-studio-800 space-y-2.5\">\n                            <div class=\"text-[10px] font-mono uppercase tracking-wider text-studio-400\">Custom Ratio (Width : Height)</div>\n                            <div class=\"flex items-center gap-2\">\n                                <input id=\"customCropW\" type=\"number\" min=\"1\" max=\"100\" step=\"1\" value=\"4\" class=\"w-full px-3 py-2 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white font-mono text-center focus:outline-none focus:border-white\">\n                                <span class=\"text-studio-400 font-mono\">:</span>\n                                <input id=\"customCropH\" type=\"number\" min=\"1\" max=\"100\" step=\"1\" value=\"3\" class=\"w-full px-3 py-2 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white font-mono text-center focus:outline-none focus:border-white\">\n                                <button id=\"customCropSwapBtn\" type=\"button\" class=\"p-2 rounded-lg bg-studio-950 border border-studio-700 text-studio-300 hover:text-white transition\" title=\"Swap width and height\">\n                                    <i data-lucide=\"arrow-left-right\" class=\"w-3.5 h-3.5\"></i>\n                                </button>\n                            </div>\n                            <p class=\"text-[11px] text-studio-400 leading-relaxed\">Enter any ratio, e.g. 21 : 9 or 5 : 7. Use the framing sliders below to position the crop.</p>\n                        </div>\n                    </div>\n\n                    <div id=\"cropOffsetControls\" class=\"space-y-3 border-t border-studio-800 pt-4\">\n                        <div class=\"flex justify-between text-xs\">\n                            <span class=\"text-studio-400\">Horizontal Framing</span>\n                            <span id=\"cropPanXVal\" class=\"font-mono text-white\">0%</span>\n                        </div>\n                        <input id=\"cropPanX\" type=\"range\" min=\"-50\" max=\"50\" value=\"0\" class=\"studio-slider\">\n\n                        <div class=\"flex justify-between text-xs pt-1\">\n                            <span class=\"text-studio-400\">Vertical Framing</span>\n                            <span id=\"cropPanYVal\" class=\"font-mono text-white\">0%</span>\n                        </div>\n                        <input id=\"cropPanY\" type=\"range\" min=\"-50\" max=\"50\" value=\"0\" class=\"studio-slider\">\n\n                        <div class=\"flex justify-between text-xs pt-1\">\n                            <span class=\"text-studio-400\">Scale / Zoom</span>\n                            <span id=\"cropZoomVal\" class=\"font-mono text-white\">100%</span>\n                        </div>\n                        <input id=\"cropZoom\" type=\"range\" min=\"100\" max=\"200\" value=\"100\" class=\"studio-slider\">\n                    </div>\n                </div>\n\n                <!-- 4. TEXT OVERLAY PANEL -->\n                <div id=\"panel-text\" class=\"tool-panel hidden space-y-4\">\n                    <div class=\"p-3 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                        <label class=\"block text-[11px] font-mono uppercase tracking-wider text-studio-400\">Add / Edit Text Layer</label>\n                        <input id=\"textInputContent\" type=\"text\" placeholder=\"Enter caption or title...\" value=\"STUDIO EDITION\" class=\"w-full px-3 py-2 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white focus:outline-none focus:border-white\">\n                        \n                        <div class=\"grid grid-cols-2 gap-2\">\n                            <div>\n                                <label class=\"block text-[10px] text-studio-400 mb-1\">Typography</label>\n                                <select id=\"textFontSelect\" class=\"w-full px-2.5 py-1.5 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white focus:outline-none\">\n                                    <option value=\"Inter\">Inter Sans</option>\n                                    <option value=\"Syne\">Syne Display</option>\n                                    <option value=\"Playfair Display\">Playfair Serif</option>\n                                    <option value=\"JetBrains Mono\">JetBrains Mono</option>\n<optgroup id=\"customFontGroup\" label=\"My fonts\"></optgroup>\n                                </select>\n                            </div>\n                            <div>\n                                <label class=\"block text-[10px] text-studio-400 mb-1\">Color</label>\n                                <div class=\"flex items-center gap-1.5\">\n                                    <input id=\"textColorPicker\" type=\"color\" value=\"#ffffff\" class=\"w-8 h-7 rounded bg-transparent border-0 cursor-pointer\">\n                                    <span id=\"textColorHex\" class=\"text-[11px] font-mono text-studio-300\">#FFFFFF</span>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"flex items-center gap-2\">\n    <label for=\"fontFileInput\" class=\"cursor-pointer flex-1 py-1.5 px-3 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white font-medium text-xs flex items-center justify-center gap-1.5 transition\"><i data-lucide=\"upload\" class=\"w-3.5 h-3.5\"></i><span>Upload font (.ttf .otf .woff)</span></label>\n    <input id=\"fontFileInput\" type=\"file\" accept=\".ttf,.otf,.woff,.woff2,font/*\" class=\"hidden\">\n</div>\n<div>\n                            <div class=\"flex justify-between text-xs mb-1\">\n                                <span class=\"text-studio-400\">Font Size</span>\n                                <span id=\"textSizeLabel\" class=\"font-mono text-white\">48px</span>\n                            </div>\n                            <input id=\"textSizeSlider\" type=\"range\" min=\"16\" max=\"160\" value=\"48\" class=\"studio-slider\">\n                        </div>\n\n                        <button id=\"addTextLayerBtn\" class=\"w-full py-2 px-3 rounded-lg bg-white hover:bg-zinc-200 text-studio-950 font-semibold text-xs flex items-center justify-center gap-1.5 transition\">\n                            <i data-lucide=\"plus\" class=\"w-3.5 h-3.5\"></i>\n                            <span>Add Text to Canvas</span>\n                        </button>\n                    </div>\n\n                    <div class=\"space-y-2\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-[11px] font-mono uppercase tracking-wider text-studio-400\">Text Layers (Drag on Canvas)</span>\n                            <button id=\"clearAllTextBtn\" class=\"text-[11px] text-studio-400 hover:text-red-400 transition\">Clear All</button>\n                        </div>\n                        <div id=\"textLayersList\" class=\"space-y-1.5\">\n                            <p class=\"text-xs text-studio-400 italic py-2\">No text overlays added yet.</p>\n                        </div>\n                    </div>\n                </div>\n\n                <!-- 5. FREEHAND DRAWING BRUSH PANEL -->\n                <div id=\"panel-draw\" class=\"tool-panel hidden space-y-4\">\n                    <div class=\"p-3 rounded-xl bg-studio-850 border border-studio-800 flex items-center justify-between\">\n                        <div>\n                            <div class=\"text-xs font-semibold text-white\">Freehand Brush Mode</div>\n                            <div class=\"text-[11px] text-studio-400\">Paint directly over the canvas</div>\n                        </div>\n                        <label class=\"relative inline-flex items-center cursor-pointer\">\n                            <input type=\"checkbox\" id=\"brushToggleCheckbox\" class=\"sr-only peer\">\n                            <div class=\"w-10 h-5 bg-studio-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-studio-950 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-white\"></div>\n                        </label>\n                    </div>\n\n                    <div class=\"p-3 rounded-xl bg-studio-850 border border-studio-800 space-y-2.5\">\n <div class=\"grid grid-cols-3 gap-1 p-1 rounded-xl bg-studio-950 border border-studio-800\">\n  <button id=\"brushModePaintBtn\" type=\"button\" class=\"py-1.5 rounded-lg text-[11px] font-semibold bg-white text-studio-950 transition\">Paint</button>\n  <button id=\"brushModeShapesBtn\" type=\"button\" class=\"py-1.5 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition\">Shapes</button>\n  <button id=\"brushModeEraseBtn\" type=\"button\" class=\"py-1.5 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition\">Erase</button>\n </div>\n <div id=\"brushShapesOptions\" class=\"hidden space-y-2.5 rounded-lg border border-studio-800 bg-studio-950 p-2.5\">\n   <div><label class=\"block text-[10px] text-studio-400 mb-1\">Shape</label><select id=\"brushShapeSelect\" class=\"w-full px-2.5 py-2 rounded-lg bg-studio-900 border border-studio-700 text-xs text-white\"><option value=\"rectangle\">Rectangle</option><option value=\"square\">Square</option><option value=\"line\">Line</option><option value=\"ellipse\">Circle / Ellipse</option><option value=\"arrow\">Arrow</option><option value=\"triangle\">Triangle</option><option value=\"star\">Star</option><option value=\"diamond\">Diamond</option><option value=\"hexagon\">Hexagon</option></select></div>\n   <div class=\"grid grid-cols-2 gap-1 p-1 rounded-lg bg-studio-900 border border-studio-800\"><button id=\"brushShapeStrokeBtn\" type=\"button\" class=\"py-1.5 rounded-md text-[11px] font-semibold bg-white text-studio-950\">Stroke</button><button id=\"brushShapeFillBtn\" type=\"button\" class=\"py-1.5 rounded-md text-[11px] text-studio-400\">Fill</button></div>\n   <p class=\"text-[10px] text-studio-500\">Drag on the photo to draw. Drag a shape to move it; drag its corner handle to resize.</p>\n </div>\n <div id=\"brushBlendRow\"><label class=\"block text-[10px] text-studio-400 mb-1\">Blend mode</label><select id=\"brushBlendSelect\" class=\"w-full px-2.5 py-1.5 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white focus:outline-none\"></select></div>\n <p id=\"brushEraseNote\" class=\"hidden text-[11px] text-studio-400 leading-relaxed\">Eraser removes brush strokes only. Your photo and PIP layers stay intact.</p>\n</div>\n<div class=\"space-y-3\">\n                        <div>\n                            <div class=\"flex justify-between text-xs mb-1.5\">\n                                <span class=\"text-studio-400\">Brush Diameter</span>\n                                <span id=\"brushSizeLabel\" class=\"font-mono text-white\">12 px</span>\n                            </div>\n                            <input id=\"brushSizeSlider\" type=\"range\" min=\"2\" max=\"80\" value=\"12\" class=\"studio-slider\">\n                        </div>\n\n                        <div>\n                            <div class=\"flex justify-between text-xs mb-1.5\">\n                                <span class=\"text-studio-400\">Brush Opacity</span>\n                                <span id=\"brushOpacityLabel\" class=\"font-mono text-white\">100%</span>\n                            </div>\n                            <input id=\"brushOpacitySlider\" type=\"range\" min=\"10\" max=\"100\" value=\"100\" class=\"studio-slider\">\n                        </div>\n\n                        <div>\n                            <label class=\"block text-xs text-studio-400 mb-2\">Stroke Color</label>\n                            <div class=\"flex items-center gap-2 flex-wrap\">\n                                <button data-color=\"#ffffff\" class=\"brush-swatch w-6 h-6 rounded-full bg-white ring-2 ring-offset-2 ring-offset-studio-900 ring-white\"></button>\n                                <button data-color=\"#09090b\" class=\"brush-swatch w-6 h-6 rounded-full bg-zinc-950 border border-zinc-700\"></button>\n                                <button data-color=\"#ef4444\" class=\"brush-swatch w-6 h-6 rounded-full bg-red-500\"></button>\n                                <button data-color=\"#f59e0b\" class=\"brush-swatch w-6 h-6 rounded-full bg-amber-500\"></button>\n                                <button data-color=\"#10b981\" class=\"brush-swatch w-6 h-6 rounded-full bg-emerald-500\"></button>\n                                <button data-color=\"#3b82f6\" class=\"brush-swatch w-6 h-6 rounded-full bg-blue-500\"></button>\n                                <button data-color=\"#ec4899\" class=\"brush-swatch w-6 h-6 rounded-full bg-pink-500\"></button>\n                                <button data-color=\"#8b5cf6\" title=\"Violet\" class=\"brush-swatch w-6 h-6 rounded-full bg-violet-500\"></button>\n                                <button data-color=\"#06b6d4\" title=\"Cyan\" class=\"brush-swatch w-6 h-6 rounded-full bg-cyan-500\"></button>\n                                <button data-color=\"#84cc16\" title=\"Lime\" class=\"brush-swatch w-6 h-6 rounded-full bg-lime-500\"></button>\n                                <button data-color=\"#f97316\" title=\"Orange\" class=\"brush-swatch w-6 h-6 rounded-full bg-orange-500\"></button>\n                                <button data-color=\"#a16207\" title=\"Brown\" class=\"brush-swatch w-6 h-6 rounded-full bg-yellow-800\"></button>\n                                <button data-color=\"#64748b\" title=\"Slate\" class=\"brush-swatch w-6 h-6 rounded-full bg-slate-500\"></button>\n                                <input id=\"brushCustomColor\" type=\"color\" value=\"#ffffff\" title=\"Choose color\" class=\"w-7 h-7 rounded cursor-pointer bg-transparent border-0\">\n                            </div>\n                            <div class=\"grid grid-cols-[1fr_auto] gap-2 mt-2\">\n                              <input id=\"brushHexColor\" type=\"text\" value=\"#ffffff\" maxlength=\"7\" spellcheck=\"false\" aria-label=\"Hex color\" placeholder=\"#RRGGBB\" class=\"min-w-0 px-2.5 py-1.5 rounded-lg bg-studio-950 border border-studio-700 text-xs font-mono text-white uppercase\">\n                              <button id=\"brushPickColorBtn\" type=\"button\" class=\"px-2.5 py-1.5 rounded-lg border border-studio-700 bg-studio-950 text-xs text-studio-200 hover:bg-studio-800 whitespace-nowrap\"><i data-lucide=\"pipette\" class=\"inline w-3.5 h-3.5 mr-1\"></i>Pick from photo</button>\n                            </div>\n                            <p id=\"brushPickColorNote\" class=\"hidden mt-1 text-[10px] text-cyan-300\">Tap a color on the photo to sample it.</p>\n                        </div>\n                    </div>\n\n                    <div class=\"pt-3 border-t border-studio-800 flex gap-2\">\n                        <button id=\"popLastStrokeBtn\" class=\"flex-1 py-2 px-3 rounded-xl bg-studio-850 hover:bg-studio-800 border border-studio-700 text-xs font-medium text-studio-200 transition\">\n                            Remove Last Stroke\n                        </button>\n                        <button id=\"clearStrokesBtn\" class=\"py-2 px-3 rounded-xl bg-studio-850 hover:bg-red-950/50 border border-studio-700 text-xs font-medium text-red-400 transition\">\n                            Clear All\n                        </button>\n                    </div>\n                </div>\n\n                <!-- 5B. PIP PANEL -->\n                <div id=\"panel-pip\" class=\"tool-panel hidden space-y-4\">\n                    <div class=\"p-3 rounded-xl bg-studio-850 border border-studio-800 space-y-2.5\">\n                        <div class=\"text-xs font-semibold text-white\">Picture-in-Picture</div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Add another photo on top. Drag it on the canvas, pull the corner dot to resize, and use the top dot to rotate. Every PIP is edited on its own and saved inside this same draft.</p>\n                        <label for=\"pipFileInput\" class=\"cursor-pointer w-full py-2 px-3 rounded-lg bg-white hover:bg-zinc-200 text-studio-950 font-semibold text-xs flex items-center justify-center gap-1.5 transition\"><i data-lucide=\"plus\" class=\"w-4 h-4\"></i><span>Add image on top</span></label>\n                        <input id=\"pipFileInput\" type=\"file\" accept=\"image/*\" class=\"hidden\">\n                    </div>\n                    <div id=\"pipList\" class=\"space-y-1.5\"></div>\n                    <div id=\"pipEditor\" class=\"space-y-3\"></div>\n                </div>\n\n                <!-- 6. LAYER MODE & EDIT TIMELINE PANEL -->\n                <div id=\"panel-layers\" class=\"tool-panel hidden space-y-5\">\n                    <div class=\"grid grid-cols-2 gap-1 p-1 rounded-xl bg-studio-950 border border-studio-800\">\n                        <button id=\"viewModeStackBtn\" class=\" py-1.5 px-2 rounded-lg text-[11px] font-semibold bg-white text-studio-950 transition flex items-center justify-center gap-1.5\">\n                            <i data-lucide=\"layers\" class=\"w-3.5 h-3.5\"></i>\n                            <span>Edit Layers</span>\n                        </button>\n                        <button id=\"viewModeTimelineBtn\" class=\"py-1.5 px-2 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition flex items-center justify-center gap-1.5\">\n                            <i data-lucide=\"history\" class=\"w-3.5 h-3.5\"></i>\n                            <span>Step Log</span>\n                        </button>\n                    </div>\n\n                    <div id=\"layersStackView\" class=\"space-y-2.5\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-[10px] font-mono uppercase tracking-wider text-studio-400\">Active Edit Stack (Top → Down)</span>\n                            <span id=\"activeLayersSummary\" class=\"text-[10px] font-mono text-studio-400\">0 edits</span>\n                        </div>\n                        <div id=\"layerStackContainer\" class=\"space-y-2\"></div>\n                    </div>\n\n                    <div id=\"layersTimelineView\" class=\"hidden space-y-2.5\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-[10px] font-mono uppercase tracking-wider text-studio-400\">Chronological Action Log</span>\n                            <span id=\"historyStepsSummary\" class=\"text-[10px] font-mono text-studio-400\">1 step</span>\n                        </div>\n                        <p class=\"text-[11px] text-studio-400 leading-relaxed\">Click any previous step below to time-travel to that exact state of your edit.</p>\n                        <div id=\"historyTimelineContainer\" class=\"space-y-1.5\"></div>\n                    </div>\n                </div>\n\n            </div>\n        </aside>\n    </div>\n\n    <!-- ================= EXPORT MODAL ================= -->\n    <div id=\"exportModal\" class=\"hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4\">\n        <div class=\"bg-studio-900 border border-studio-700 rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-5\">\n            <div class=\"flex items-center justify-between border-b border-studio-800 pb-3\">\n                <div class=\"flex items-center gap-2\">\n                    <i data-lucide=\"download\" class=\"w-4 h-4 text-white\"></i>\n                    <h3 id=\"exportModalTitle\" class=\"text-sm font-semibold text-white\">Export Image</h3>\n                </div>\n                <button id=\"closeExportModalBtn\" class=\"text-studio-400 hover:text-white p-1 rounded-lg\">\n                    <i data-lucide=\"x\" class=\"w-4 h-4\"></i>\n                </button>\n            </div>\n\n            <div class=\"space-y-4\">\n                <div>\n                    <label class=\"block text-xs text-studio-400 mb-1.5\">File Name</label>\n                    <input id=\"exportFilenameInput\" type=\"text\" value=\"studio-master-edit\" class=\"w-full px-3 py-2 rounded-xl bg-studio-950 border border-studio-700 text-xs text-white font-mono focus:outline-none focus:border-white\">\n                </div>\n\n                <div>\n                    <label class=\"block text-xs text-studio-400 mb-1.5\">Image Format</label>\n                    <div class=\"grid grid-cols-2 gap-2.5\">\n                        <button data-format=\"image/jpeg\" class=\"export-fmt-btn py-2.5 px-3 rounded-xl bg-white text-studio-950 font-semibold text-xs border border-white flex items-center justify-center gap-2 transition\">\n                            <span>JPG (Compressed)</span>\n                        </button>\n                        <button data-format=\"image/png\" class=\"export-fmt-btn py-2.5 px-3 rounded-xl bg-studio-850 text-studio-300 font-medium text-xs border border-studio-700 flex items-center justify-center gap-2 transition\">\n                            <span>PNG (Lossless)</span>\n                        </button>\n                    </div>\n                </div>\n\n                <p class=\"text-[11px] text-studio-400 -mt-2\">JPG fills transparent  w-72 max-w-[85vw] -translate-x-full transition-transform duration-200 bg-studio-900 border-r border-studio-800 flex flex-col\">\n        <div class=\"h-14 px-4 border-b border-studio-800 flex items-center justify-between shrink-0\">\n            <div class=\"flex items-center gap-2\">\n                <i data-lucide=\"images\" class=\"w-4 h-4 text-white\"></i>\n                <span class=\"text-xs font-semibold uppercase tracking-wider text-white\">Drafts</span>\n                <span id=\"draftsSummary\" class=\"text-[10px] font-mono text-studio-400\">0 drafts</span>\n            </div>\n            <div class=\"flex items-center gap-1.5\">\n                <button id=\"clearAllDraftsBtn\" type=\"button\" class=\"p-1.5 rounded-lg text-studio-400 hover:text-red-300 hover:bg-red-950/50 transition\" title=\"Double-click to clear all drafts\" aria-label=\"Clear all drafts\">\n                    <i data-lucide=\"trash-2\" class=\"w-4 h-4\"></i>\n                </button>\n                <button id=\"closeDraftsBtn\" type=\"button\" class=\"p-1.5 rounded-lg text-studio-400 hover:text-white hover:bg-studio-800 transition\" aria-label=\"Close drafts\"><i data-lucide=\"x\" class=\"w-4 h-4\"></i></button>\n            </div>\n        </div>\n        <div class=\"p-3 border-b border-studio-800 shrink-0\">\n            <label for=\"fileUploadInput\" class=\"cursor-pointer w-full py-2 px-3 rounded-lg bg-white hover:bg-zinc-200 text-studio-950 font-semibold text-xs flex items-center justify-center gap-1.5 transition\">\n                <i data-lucide=\"plus\" class=\"w-4 h-4\"></i><span>New draft from photo</span>\n            </label>\n            <button id=\"batchImportBtn\" type=\"button\" class=\"mt-2 w-full py-2 px-3 rounded-lg bg-studio-850 hover:bg-studio-800 border border-studio-700 text-studio-100 font-semibold text-xs flex items-center justify-center gap-1.5 transition\"><i data-lucide=\"layers\" class=\"w-4 h-4\"></i><span>Batch edit photos</span></button>\n            <input id=\"batchFileInput\" type=\"file\" accept=\"image/*\" multiple class=\"hidden\">\n            <div id=\"batchPhotoList\" class=\"hidden mt-2 space-y-1.5\"></div>\n        </div>\n        <div id=\"draftsList\" class=\"flex-1 overflow-y-auto p-3 space-y-2\"></div>\n        <p class=\"px-4 py-3 border-t border-studio-800 text-[10px] text-studio-400 leading-relaxed shrink-0\">Saved automatically in this browser. Tap the active draft's name to rename it. The undo history resets when a draft is reopened.</p>\n    </aside>\n\n    <!-- ================= TOAST NOTIFICATION ================= -->\n    <div id=\"studioToast\" style=\"position:fixed;bottom:5rem;top:auto;left:50%;right:auto;transform:translateX(-50%);z-index:9999;\" class=\"pointer-events-none fixed bottom-16 lg:bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 translate-y-2 transition-all duration-200 px-4 py-2 rounded-full bg-white text-studio-950 font-medium text-xs shadow-xl flex items-center gap-2\">\n        <i data-lucide=\"check-circle-2\" class=\"w-3.5 h-3.5\"></i>\n        <span id=\"studioToastText\">Saved to history</span>\n    </div>\n\n    <!-- ================= STREAMING_CHUNK:Initializing Application Script & Logic ================= -->\n    <script>\n        lucide.createIcons();\n        bindBatchEditing();\n\n        const ADJUSTMENT_CONFIG = [\n            { key: 'brightness', label: 'Brightness', min: 0, max: 200, default: 100, unit: '%' },\n            { key: 'contrast',   label: 'Contrast',   min: 0, max: 200, default: 100, unit: '%' },\n            { key: 'saturation', label: 'Saturation', min: 0, max: 200, default: 100, unit: '%' },\n            { key: 'exposure',   label: 'Exposure',   min: -100, max: 100, default: 0, unit: '' },\n            { key: 'vignette',   label: 'Vignette',   min: 0, max: 100, default: 0, unit: '%' },\n            { key: 'grayscale',  label: 'Grayscale',  min: 0, max: 100, default: 0, unit: '%' },\n            { key: 'sepia',      label: 'Sepia',      min: 0, max: 100, default: 0, unit: '%' },\n            { key: 'hueRotate',  label: 'Hue Shift',  min: -180, max: 180, default: 0, unit: '°' },\n            { key: 'blur',       label: 'Gaussian Blur', min: 0, max: 20, default: 0, unit: 'px' },\n            { key: 'invert',     label: 'Invert',     min: 0, max: 100, default: 0, unit: '%' }\n        ];\n\n        const STUDIO_PRESETS = [\n            {\n                id: 'original',\n                name: 'Original',\n                desc: 'Neutral calibration',\n                values: { brightness: 100, contrast: 100, saturation: 100, exposure: 0, grayscale: 0, sepia: 0, blur: 0, hueRotate: 0, vignette: 0, invert: 0 }\n            },\n            {\n                id: 'noir',\n                name: 'Monochrome Noir',\n                desc: 'Silver gelatin contrast',\n                values: { brightness: 96, contrast: 145, saturation: 0, exposure: -5, grayscale: 100, sepia: 0, blur: 0, hueRotate: 0, vignette: 45, invert: 0 }\n            },\n            {\n                id: 'vintage',\n                name: 'Vintage 70s',\n                desc: 'Warm nostalgic grain',\n                values: { brightness: 104, contrast: 92, saturation: 80, exposure: 6, grayscale: 15, sepia: 45, blur: 0, hueRotate: -8, vignette: 35, invert: 0 }\n            },\n            {\n                id: 'warm',\n                name: 'Golden Warmth',\n                desc: 'Sunlit amber highlights',\n                values: { brightness: 105, contrast: 108, saturation: 128, exposure: 5, grayscale: 0, sepia: 22, blur: 0, hueRotate: -10, vignette: 15, invert: 0 }\n            },\n            {\n                id: 'cool',\n                name: 'Nordic Cool',\n                desc: 'Crisp cyan shadows',\n                values: { brightness: 100, contrast: 112, saturation: 85, exposure: 0, grayscale: 0, sepia: 0, blur: 0, hueRotate: 18, vignette: 20, invert: 0 }\n            },\n            {\n                id: 'cyberpunk',\n
