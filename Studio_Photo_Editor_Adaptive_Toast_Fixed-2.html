[i + 3] < 10) continue;\n                hist[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])]++;\n                total++;\n            }\n            if (!total) throw new Error('Nothing to enhance');\n            let acc = 0, lo = 0, hi = 255;\n            for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.005) { lo = v; break; } }\n            acc = 0;\n            for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= total * 0.005) { hi = v; break; } }\n            if (hi - lo < 8) throw new Error('Photo is already flat, nothing to stretch');\n            const scale = 255 / (hi - lo);\n            let meanAcc = 0;\n            for (let v = 0; v < 256; v++) meanAcc += hist[v] * Math.max(0, Math.min(255, (v - lo) * scale));\n            const mean = Math.max(20, Math.min(235, meanAcc / total));\n            const gamma = Math.max(0.75, Math.min(1.35, Math.log(0.46) / Math.log(mean / 255)));\n            const lut = new Uint8ClampedArray(256);\n            for (let v = 0; v < 256; v++) {\n                const n = Math.max(0, Math.min(1, ((v - lo) * scale) / 255));\n                lut[v] = Math.round(255 * Math.pow(n, gamma));\n            }\n            for (let i = 0; i < d.length; i += 4) { d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; }\n            ctx.putImageData(img, 0, 0);\n            return src;\n        }\n\n        function sharpenOp(src, amount) {\n            const w = src.width, h = src.height;\n            const ctx = src.getContext('2d');\n            const sharp = ctx.getImageData(0, 0, w, h);\n            const blurC = document.createElement('canvas');\n            blurC.width = w; blurC.height = h;\n            const bctx = blurC.getContext('2d');\n            bctx.filter = 'blur(1.2px)';\n            bctx.drawImage(src, 0, 0);\n            const b = bctx.getImageData(0, 0, w, h).data;\n            const d = sharp.data;\n            for (let i = 0; i < d.length; i += 4) {\n                d[i] = clamp255(d[i] + amount * (d[i] - b[i]));\n                d[i + 1] = clamp255(d[i + 1] + amount * (d[i + 1] - b[i + 1]));\n                d[i + 2] = clamp255(d[i + 2] + amount * (d[i + 2] - b[i + 2]));\n            }\n            ctx.putImageData(sharp, 0, 0);\n            return src;\n        }\n\n        function smoothOp(src, amount) {\n            const w = src.width, h = src.height;\n            const out = document.createElement('canvas');\n            out.width = w; out.height = h;\n            const octx = out.getContext('2d');\n            octx.drawImage(src, 0, 0);\n            octx.globalAlpha = amount;\n            octx.filter = `blur(${Math.max(2, Math.round(Math.max(w, h) / 300))}px)`;\n            octx.drawImage(src, 0, 0);\n            return out;\n        }\n\n        function pixelateOp(src, sizeSlider) {\n            const w = src.width, h = src.height;\n            const block = Math.max(2, Math.round(sizeSlider * Math.max(w, h) / 1000));\n            const sw = Math.max(1, Math.round(w / block));\n            const sh = Math.max(1, Math.round(h / block));\n            const small = document.createElement('canvas');\n            small.width = sw; small.height = sh;\n            small.getContext('2d').drawImage(src, 0, 0, sw, sh);\n            const out = document.createElement('canvas');\n            out.width = w; out.height = h;\n            const octx = out.getContext('2d');\n            octx.imageSmoothingEnabled = false;\n            octx.drawImage(small, 0, 0, sw, sh, 0, 0, w, h);\n            return out;\n        }\n\n        function shapeOp(src, kind, radiusPct) {\n            let sx = 0, sy = 0, sw = src.width, sh = src.height;\n            if (kind === 'circle') {\n                const m = Math.min(sw, sh);\n                sx = (sw - m) / 2; sy = (sh - m) / 2; sw = m; sh = m;\n            }\n            const out = document.createElement('canvas');\n            out.width = sw; out.height = sh;\n            const octx = out.getContext('2d');\n            octx.beginPath();\n            if (kind === 'circle') {\n                octx.arc(sw / 2, sh / 2, sw / 2, 0, Math.PI * 2);\n            } else {\n                const r = Math.min(sw, sh) * (radiusPct / 100);\n                octx.moveTo(r, 0);\n                octx.arcTo(sw, 0, sw, sh, r);\n                octx.arcTo(sw, sh, 0, sh, r);\n                octx.arcTo(0, sh, 0, 0, r);\n                octx.arcTo(0, 0, sw, 0, r);\n                octx.closePath();\n            }\n            octx.clip();\n            octx.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);\n            return out;\n        }\n\n        function borderOp(src, pct, color) {\n            const bw = Math.round((pct / 100) * Math.min(src.width, src.height));\n            if (bw < 1) throw new Error('Border is too thin');\n            const out = document.createElement('canvas');\n            out.width = src.width + bw * 2;\n            out.height = src.height + bw * 2;\n            const octx = out.getContext('2d');\n            octx.fillStyle = color;\n            octx.fillRect(0, 0, out.width, out.height);\n            octx.drawImage(src, bw, bw);\n            return out;\n        }\n\n        function resizeOp(src, nw, nh) {\n            if (!(nw >= 16 && nh >= 16) || nw > 8000 || nh > 8000) throw new Error('Size must be between 16 and 8000 px');\n            const out = document.createElement('canvas');\n            out.width = nw; out.height = nh;\n            const octx = out.getContext('2d');\n            octx.imageSmoothingQuality = 'high';\n            octx.drawImage(src, 0, 0, nw, nh);\n            return out;\n        }\n\n        function updateToolsDimsUI() {\n            const wEl = document.getElementById('resizeW');\n            const hEl = document.getElementById('resizeH');\n            if (!wEl || !isImageLoaded) return;\n            if (document.activeElement === wEl || document.activeElement === hEl) return;\n            wEl.value = sourceImage.naturalWidth || sourceImage.width;\n            hEl.value = sourceImage.naturalHeight || sourceImage.height;\n        }\n\n        function setBgMode(mode) {\n            bgMode = mode;\n            const on = 'py-1.5 px-1 rounded-lg text-[11px] font-semibold bg-white text-studio-950 transition';\n            const off = 'py-1.5 px-1 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition';\n            document.getElementById('bgModeSmartBtn').className = mode === 'smart' ? on : off;\n            document.getElementById('bgModeAutoBtn').className = mode === 'auto' ? on : off;\n            document.getElementById('bgModePickBtn').className = mode === 'pick' ? on : off;\n            document.getElementById('bgSmartInfo').classList.toggle('hidden', mode !== 'smart');\n            document.getElementById('bgColorControls').classList.toggle('hidden', mode === 'smart');\n            document.getElementById('bgPickRow').classList.toggle('hidden', mode !== 'pick');\n            if (mode !== 'pick') { isPickingBgColor = false; updateInteractiveModeHUD(); }\n        }\n\n        let bgRemoverPromise = null;\n        function loadBgRemover() {\n            if (!bgRemoverPromise) {\n                bgRemoverPromise = Promise.reject(new Error('Smart background removal needs an optional model that is not bundled in this offline edition.'));\n                bgRemoverPromise.catch(() => { bgRemoverPromise = null; });\n            }\n            return bgRemoverPromise;\n        }\n\n        async function smartRemoveBackground() {\n            if (!isImageLoaded) { showToast('Open a photo first'); return; }\n            if (isToolBusy) return;\n            isToolBusy = true;\n            const status = document.getElementById('bgSmartStatus');\n            const btn = document.getElementById('bgRemoveBtn');\n            const setStatus = (t) => { status.textContent = t; status.classList.toggle('hidden', !t); };\n            btn.disabled = true;\n            try {\n                setStatus('Loading model...');\n                const removeBackground = await loadBgRemover();\n                const srcBlob = await canvasToBlob(getSourceCanvas());\n                setStatus('Preparing...');\n                const outBlob = await removeBackground(srcBlob, {\n                    output: { format: 'image/png' },\n                    progress: (key, current, total) => {\n                        if (total > 0) setStatus(`${String(key).startsWith('fetch') ? 'Downloading model' : 'Processing'} ${Math.round(current / total * 100)}%`);\n                    }\n                });\n                setStatus('Applying...');\n                const cutImg = await loadImageFromBlob(outBlob);\n                const c = document.createElement('canvas');\n                c.width = cutImg.naturalWidth || cutImg.width;\n                c.height = cutImg.naturalHeight || cutImg.height;\n                c.getContext('2d').drawImage(cutImg, 0, 0);\n                await commitSourceCanvas(c, 'Removed Background (Smart)');\n                showToast('Background removed');\n                setStatus('');\n            } catch (err) {\n                setStatus('');\n                showToast('Smart removal failed. Check your internet connection and try again, or use a colour mode.');\n                console.error(err);\n            } finally {\n                btn.disabled = false;\n                isToolBusy = false;\n            }\n        }\n\n        function pickBgColorAt(clientX, clientY) {\n            const rect = canvas.getBoundingClientRect();\n            const x = Math.max(0, Math.min(canvas.width - 1, Math.floor((clientX - rect.left) / rect.width * canvas.width)));\n            const y = Math.max(0, Math.min(canvas.height - 1, Math.floor((clientY - rect.top) / rect.height * canvas.height)));\n            pickRaw = true;\n            renderCanvas();\n            const px = ctx.getImageData(x, y, 1, 1).data;\n            pickRaw = false;\n            renderCanvas();\n            isPickingBgColor = false;\n            updateInteractiveModeHUD();\n            if (px[3] < 10) { showToast('That spot is already transparent'); return; }\n            bgPickColor = { r: px[0], g: px[1], b: px[2] };\n            const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');\n            document.getElementById('bgPickSwatch').style.background = hex;\n            document.getElementById('bgPickHex').textContent = hex.toUpperCase();\n            showToast('Background colour picked');\n        }\n\n        function openNumericValueEditor({ label, min, max, value, suffix = '', step = '1', onApply }) {\n            document.getElementById('numericValueEditor')?.remove();\n            const isPercent = String(suffix).trim() === '%';\n            const backdrop = document.createElement('div');\n            backdrop.id = 'numericValueEditor';\n            backdrop.className = 'numeric-editor-backdrop';\n            backdrop.innerHTML = `\n                <form class=\"numeric-editor-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"numericEditorTitle\">\n                    <div id=\"numericEditorTitle\" class=\"text-sm font-semibold\">Set ${label}</div>\n                    <input class=\"numeric-editor-input\" type=\"number\" inputmode=\"decimal\" step=\"${step}\" value=\"${String(value).replace(/&/g, '&amp;').replace(/\"/g, '&quot;')}\" aria-label=\"${label} value\">\n                    <div class=\"numeric-editor-limit mt-2 text-[11px] text-studio-400\">${isPercent ? '' : `${min} to ${max} limit`}</div>\n                    <div class=\"mt-5 flex justify-end gap-2\">\n                        <button type=\"button\" class=\"numeric-editor-cancel px-4 py-2 rounded-lg border border-studio-700 text-xs text-studio-300\">Cancel</button>\n                        <button type=\"submit\" class=\"numeric-editor-confirm px-4 py-2 rounded-lg bg-white text-studio-950 text-xs font-semibold\">Confirm</button>\n                    </div>\n                </form>`;\n            document.body.appendChild(backdrop);\n            const form = backdrop.querySelector('form');\n            const input = backdrop.querySelector('input');\n            const confirm = backdrop.querySelector('.numeric-editor-confirm');\n            const cancel = () => backdrop.remove();\n            const validate = () => {\n                const raw = input.value.trim();\n                const number = Number(raw);\n                const valid = raw !== '' && Number.isFinite(number) && number >= Number(min) && number <= Number(max);\n                input.classList.toggle('invalid', !valid);\n                confirm.disabled = !valid;\n                return valid;\n            };\n            input.addEventListener('input', validate);\n            backdrop.querySelector('.numeric-editor-cancel').addEventListener('click', cancel);\n            backdrop.addEventListener('click', event => { if (event.target === backdrop) cancel(); });\n            form.addEventListener('submit', event => {\n                event.preventDefault();\n                if (!validate()) return;\n                onApply(Number(input.value));\n                cancel();\n            });\n            input.focus();\n            input.select();\n            validate();\n        }\n\n        function bindTools() {\n            // Make every slider's displayed value directly editable, including controls outside Adjust.\n            const sliderValueBindings = [\n                ['cropPanX', 'cropPanXVal', '%', 'Crop horizontal position'],\n                ['cropPanY', 'cropPanYVal', '%', 'Crop vertical position'],\n                ['cropZoom', 'cropZoomVal', '%', 'Crop zoom'],\n                ['textSizeSlider', 'textSizeLabel', 'px', 'Font size'],\n                ['brushSizeSlider', 'brushSizeLabel', ' px', 'Brush diameter'],\n                ['brushOpacitySlider', 'brushOpacityLabel', '%', 'Brush opacity'],\n                ['exportQualitySlider', 'exportQualityLabel', '%', 'Export quality']\n            ];\n            sliderValueBindings.forEach(([sliderId, labelId, suffix, label]) => {\n                const slider = document.getElementById(sliderId);\n                const valueLabel = document.getElementById(labelId);\n                if (slider && valueLabel) {\n                    slider.dataset.valLabel = labelId;\n                    slider.dataset.suffix = suffix;\n                    valueLabel.dataset.label = label;\n                }\n            });\n            document.addEventListener('click', (event) => {\n                const valueNode = event.target.closest('[data-val-label], .editable-slider-value, .pv');\n                if (!valueNode || valueNode.classList.contains('slider-val-btn')) return;\n                const row = valueNode.closest('[data-row]');\n                const slider = valueNode.id\n                    ? document.querySelector(`[data-val-label=\"${valueNode.id}\"]`)\n                    : row?.querySelector('input[type=\"range\"]');\n                if (!slider) return;\n                event.preventDefault();\n                const suffix = slider.dataset.suffix ?? slider.dataset.u ?? '';\n                const label = valueNode.dataset.label || valueNode.closest('[data-row]')?.querySelector('label')?.textContent?.trim() || valueNode.closest('.space-y-3, .space-y-4')?.querySelector('label, span')?.textContent?.trim() || 'value';\n                openNumericValueEditor({\n                    label, min: slider.min, max: slider.max, value: slider.value, suffix, step: slider.step || '1',\n                    onApply: value => {\n                        slider.value = value;\n                        slider.dispatchEvent(new Event('input', { bubbles: true }));\n                        slider.dispatchEvent(new Event('change', { bubbles: true }));\n                    }\n                });\n            });\n            document.querySelectorAll('[data-val-label]').forEach(el => {\n                const lab = document.getElementById(el.dataset.valLabel);\n                if (lab) { lab.classList.add('editable-slider-value'); lab.title = 'Click to enter a value'; }\n                const updLab = document.getElementById(el.dataset.valLabel);\n                const upd = () => { if (updLab) updLab.textContent = el.value + (el.dataset.suffix || ''); };\n                el.addEventListener('input', upd);\n                upd();\n            });\n\n            document.getElementById('bgModeSmartBtn').addEventListener('click', () => setBgMode('smart'));\n            document.getElementById('bgModeAutoBtn').addEventListener('click', () => setBgMode('auto'));\n            document.getElementById('bgModePickBtn').addEventListener('click', () => setBgMode('pick'));\n            document.getElementById('bgPickBtn').addEventListener('click', () => {\n                if (!isImageLoaded) { showToast('Open a photo first'); return; }\n                isPickingBgColor = true;\n                updateInteractiveModeHUD();\n            });\n            document.getElementById('bgRemoveBtn').addEventListener('click', () => {\n                if (bgMode === 'smart') { smartRemoveBackground(); return; }\n                const tol = Number(document.getElementById('bgTol').value);\n                const feather = Number(document.getElementById('bgFeather').value);\n                const connected = document.getElementById('bgConnectedOnly').checked;\n                runTool('Removed Background', (src) => {\n                    const keys = bgMode === 'pick' ? [bgPickColor] : cornerKeyColors(src);\n                    if (!keys.length) throw new Error('Could not sample the background');\n                    return removeBackgroundOp(src, keys, tol, feather, connected);\n                });\n            });\n\n            document.getElementById('autoEnhanceBtn').addEventListener('click', () => runTool('Auto Enhance', autoEnhanceOp));\n            document.getElementById('sharpenBtn').addEventListener('click', () => {\n                const amt = Number(document.getElementById('sharpenAmt').value) / 100;\n                runTool('Sharpen', (src) => sharpenOp(src, amt));\n            });\n            document.getElementById('smoothBtn').addEventListener('click', () => {\n                const amt = Number(document.getElementById('smoothAmt').value) / 100;\n                runTool('Smooth', (src) => smoothOp(src, amt));\n            });\n            document.getElementById('pixelateBtn').addEventListener('click', () => {\n                const sz = Number(document.getElementById('pixelSize').value);\n                runTool('Pixelate', (src) => pixelateOp(src, sz));\n            });\n            document.getElementById('shapeCircleBtn').addEventListener('click', () => runTool('Circle Crop', (src) => shapeOp(src, 'circle', 0)));\n            document.getElementById('shapeRoundBtn').addEventListener('click', () => {\n                const r = Number(document.getElementById('roundRadius').value);\n                runTool('Rounded Corners', (src) => shapeOp(src, 'round', r));\n            });\n            document.getElementById('borderBtn').addEventListener('click', () => {\n                const pct = Number(document.getElementById('borderWidth').value);\n                const color = document.getElementById('borderColor').value;\n                runTool('Added Border', (src) => borderOp(src, pct, color));\n            });\n\n            const rw = document.getElementById('resizeW');\n            const rh = document.getElementById('resizeH');\n            rw.addEventListener('input', () => {\n                if (document.getElementById('resizeLock').checked && isImageLoaded) {\n                    const ratio = (sourceImage.naturalHeight || sourceImage.height) / (sourceImage.naturalWidth || sourceImage.width);\n                    rh.value = Math.round(Number(rw.value) * ratio) || '';\n                }\n            });\n            rh.addEventListener('input', () => {\n                if (document.getElementById('resizeLock').checked && isImageLoaded) {\n                    const ratio = (sourceImage.naturalWidth || sourceImage.width) / (sourceImage.naturalHeight || sourceImage.height);\n                    rw.value = Math.round(Number(rh.value) * ratio) || '';\n                }\n            });\n            document.getElementById('resizeBtn').addEventListener('click', () => {\n                const nw = Math.round(Number(rw.value)), nh = Math.round(Number(rh.value));\n                runTool(`Resized ${nw}x${nh}`, (src) => resizeOp(src, nw, nh));\n            });\n\n            document.querySelectorAll('.emoji-btn').forEach(btn => {\n                btn.addEventListener('click', () => {\n                    if (!isImageLoaded) { showToast('Open a photo first'); return; }\n                    const layer = {\n                        id: 'txt_' + Date.now(),\n                        text: btn.dataset.emoji,\n                        font: 'Inter',\n                        color: '#ffffff',\n                        size: 120,\n                        x: 0.5 + (Math.random() - 0.5) * 0.25,\n                        y: 0.5 + (Math.random() - 0.5) * 0.25,\n                        visible: true\n                    };\n                    state.textLayers.push(layer);\n                    selectedTextLayerId = layer.id;\n                    renderTextLayersListUI();\n                    renderCanvas();\n                    pushHistory('Added Sticker');\n                });\n            });\n\n            document.getElementById('revertBaseBtn').addEventListener('click', () => {\n                if (!originalImage || sourceImage === originalImage) { showToast('Image is already the original'); return; }\n                sourceImage = originalImage;\n                state.toolOps = [];\n                syncUIFromState();\n                renderCanvas();\n                pushHistory('Reverted to Original Image');\n                showToast('Reverted to original upload');\n            });\n        }\n\n        function resetToolControls() {\n            const defaults = { bgTol: 30, bgFeather: 1, sharpenAmt: 80, smoothAmt: 50, pixelSize: 12, roundRadius: 20, borderWidth: 4 };\n            Object.entries(defaults).forEach(([id, v]) => {\n                const el = document.getElementById(id);\n                el.value = v;\n                el.dispatchEvent(new Event('input'));\n            });\n            document.getElementById('bgConnectedOnly').checked = true;\n            setBgMode('smart');\n        }\n\n        // ================= EXTRAS: custom fonts, brush blend/erase, PIP =================\n        const $ = (id) => document.getElementById(id);\n        const BLEND_OPTS = [['source-over','Normal'],['multiply','Multiply'],['screen','Screen'],['overlay','Overlay'],['soft-light','Soft Light'],['hard-light','Hard Light'],['darken','Darken'],['lighten','Lighten'],['color-dodge','Color Dodge'],['color-burn','Color Burn'],['difference','Difference'],['exclusion','Exclusion'],['hue','Hue'],['color','Color'],['luminosity','Luminosity']];\n        const blendName = (v) => (BLEND_OPTS.find(b => b[0] === v) || BLEND_OPTS[0])[1];\n        const blendHtml = (sel) => BLEND_OPTS.map(([v, n]) => `<option value=\"${v}\" ${v === sel ? 'selected' : ''}>${n}</option>`).join('');\n        const PIP_ADJ = [['brightness','Brightness',0,200,100,'%'],['contrast','Contrast',0,200,100,'%'],['saturation','Saturation',0,200,100,'%'],['grayscale','Grayscale',0,100,0,'%'],['sepia','Sepia',0,100,0,'%'],['hueRotate','Hue Shift',-180,180,0,'°'],['blur','Blur',0,20,0,'px']];\n\n        // ---- custom fonts ----\n        async function registerFont(name, buf) {\n            const face = new FontFace(name, buf);\n            await face.load();\n            document.fonts.add(face);\n            const sel = $('textFontSelect');\n            if (![...sel.options].some(o => o.value === name)) {\n                const op = document.createElement('option');\n                op.value = name; op.textContent = name;\n                $('customFontGroup').appendChild(op);\n            }\n        }\n\n        async function loadCustomFonts() {\n            try {\n                const list = (await dbGetBlob('fontlist')) || [];\n                for (const name of list) {\n                    try {\n                        const blob = await dbGetBlob('font:' + name);\n                        if (blob) await registerFont(name, await blob.arrayBuffer());\n                    } catch (e) { /* skip broken font */ }\n                }\n            } catch (e) { /* no storage */ }\n        }\n\n        async function handleFontFile(file) {\n            const name = file.name.replace(/\\.[^.]+$/, '').replace(/[^\\w\\- ]/g, '').trim().slice(0, 40) || 'Custom Font';\n            try {\n                const buf = await file.arrayBuffer();\n                await registerFont(name, buf.slice(0));\n                $('textFontSelect').value = name;\n                try {\n                    const list = (await dbGetBlob('fontlist')) || [];\n                    await dbPutBlobRaw('font:' + name, new Blob([buf]));\n                    if (!list.includes(name)) { list.push(name); await dbPutBlobRaw('fontlist', list); }\n                } catch (e) { /* font still works this session */ }\n                if (selectedTextLayerId) $('textFontSelect').dispatchEvent(new Event('change'));\n                renderCanvas();\n                showToast(`Font \"${name}\" ready ✨`);\n            } catch (err) {\n                showToast('Could not read that font file');\n            }\n        }\n\n        // ---- PIP ----\n        function pipLook() {\n            const adj = {};\n            PIP_ADJ.forEach(([k, , , , d]) => adj[k] = d);\n            return { opacity: 100, blend: 'source-over', flipH: false, flipV: false, shape: 'rect', round: 20, adj };\n        }\n\n        function pipGeom(L, W, H) {\n            const r = pipImages[L.imageId];\n            if (!r) return null;\n            const iw = r.img.naturalWidth, ih = r.img.naturalHeight;\n            const w = Math.max(8, L.scale * W);\n            return { r, iw, ih, w, h: w * ih / iw, cx: L.x * W, cy: L.y * H, rot: L.rotation * Math.PI / 180 };\n        }\n\n        function pipPath(o, w, h, shape, round) {\n            o.beginPath();\n            if (shape === 'circle') o.arc(w / 2, h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);\n            else if (shape === 'rounded') {\n                const r = Math.min(w, h) * round / 100;\n                o.moveTo(r, 0); o.arcTo(w, 0, w, h, r); o.arcTo(w, h, 0, h, r); o.arcTo(0, h, 0, 0, r); o.arcTo(0, 0, w, 0, r); o.closePath();\n            } else o.rect(0, 0, w, h);\n        }\n\n        function drawPip(c, L, W, H) {\n            const g = pipGeom(L, W, H);\n            if (!g) return;\n            const off = document.createElement('canvas');\n            off.width = Math.max(1, Math.ceil(g.w)); off.height = Math.max(1, Math.ceil(g.h));\n            const o = off.getContext('2d'), a = L.adj;\n            o.filter = `brightness(${a.brightness}%) contrast(${a.contrast}%) saturate(${a.saturation}%) grayscale(${a.grayscale}%) sepia(${a.sepia}%) hue-rotate(${a.hueRotate}deg) blur(${a.blur}px)`;\n            pipPath(o, g.w, g.h, L.shape, L.round);\n            o.clip();\n            o.drawImage(g.r.img, 0, 0, g.w, g.h);\n            c.save();\n            c.translate(g.cx, g.cy);\n            c.rotate(g.rot);\n            c.scale(L.flipH ? -1 : 1, L.flipV ? -1 : 1);\n            c.globalAlpha = L.opacity / 100;\n            c.globalCompositeOperation = L.blend;\n            c.drawImage(off, -g.w / 2, -g.h / 2);\n            c.restore();\n        }\n\n        const pipHandleR = (W) => Math.max(8, W / 70);\n\n        function drawPipSelection(c, L, W, H) {\n            const g = pipGeom(L, W, H);\n            if (!g) return;\n            const hr = pipHandleR(W), lw = Math.max(2, W / 500);\n            c.save();\n            c.translate(g.cx, g.cy);\n            c.rotate(g.rot);\n            c.strokeStyle = '#fff'; c.lineWidth = lw; c.setLineDash([6 * lw, 4 * lw]);\n            c.strokeRect(-g.w / 2, -g.h / 2, g.w, g.h);\n            c.setLineDash([]);\n            c.fillStyle = '#fff'; c.strokeStyle = '#09090b';\n            c.beginPath(); c.moveTo(0, -g.h / 2); c.lineTo(0, -g.h / 2 - hr * 3); c.stroke();\n            c.beginPath(); c.arc(g.w / 2, g.h / 2, hr, 0, Math.PI * 2); c.fill(); c.stroke();\n            c.beginPath(); c.arc(0, -g.h / 2 - hr * 3, hr, 0, Math.PI * 2); c.fill(); c.stroke();\n            c.restore();\n        }\n\n        function pipLocal(g, p) {\n            const dx = p.x - g.cx, dy = p.y - g.cy, cs = Math.cos(-g.rot), sn = Math.sin(-g.rot);\n            return { x: dx * cs - dy * sn, y: dx * sn + dy * cs };\n        }\n\n        function pipPointerDown(pt) {\n            const W = canvas.width, H = canvas.height, p = { x: pt.x * W, y: pt.y * H }, hr = pipHandleR(W) * 2;\n            let hit = null;\n            const sel = state.pipLayers.find(l => l.id === selectedPipId && l.visible !== false);\n            if (sel) {\n                const g = pipGeom(sel, W, H);\n                if (g) {\n                    const q = pipLocal(g, p);\n                    if (Math.hypot(q.x - g.w / 2, q.y - g.h / 2) <= hr) hit = { L: sel, mode: 'resize' };\n                    else if (Math.hypot(q.x, q.y + g.h / 2 + pipHandleR(W) * 3) <= hr) hit = { L: sel, mode: 'rotate' };\n                }\n            }\n            for (let i = state.pipLayers.length - 1; i >= 0 && !hit; i--) {\n                const L = state.pipLayers[i];\n                if (L.visible === false) continue;\n                const g = pipGeom(L, W, H);\n                if (!g) continue;\n                const q = pipLocal(g, p);\n                if (Math.abs(q.x) <= g.w / 2 && Math.abs(q.y) <= g.h / 2) hit = { L, mode: 'move' };\n            }\n            if (!hit) { selectedPipId = null; pipDrag = null; renderPipPanelUI(); renderCanvas(); return; }\n            selectedPipId = hit.L.id;\n            pipDrag = { id: hit.L.id, mode: hit.mode, dx: p.x - hit.L.x * W, dy: p.y - hit.L.y * H, moved: false };\n            renderPipPanelUI();\n            renderCanvas();\n        }\n\n        function pipPointerMove(pt) {\n            const L = state.pipLayers.find(l => l.id === pipDrag.id);\n            if (!L) return;\n            const W = canvas.width, H = canvas.height, p = { x: pt.x * W, y: pt.y * H };\n            pipDrag.moved = true;\n            if (pipDrag.mode === 'move') {\n                L.x = Math.max(0, Math.min(1, (p.x - pipDrag.dx) / W));\n                L.y = Math.max(0, Math.min(1, (p.y - pipDrag.dy) / H));\n            } else {\n                const g = pipGeom(L, W, H);\n                if (pipDrag.mode === 'resize') {\n                    const ratio = g.ih / g.iw;\n                    L.scale = Math.max(0.05, Math.min(3, (2 * Math.hypot(p.x - g.cx, p.y - g.cy) / Math.sqrt(1 + ratio * ratio)) / W));\n                } else {\n                    let ang = Math.atan2(p.y - g.cy, p.x - g.cx) * 180 / Math.PI + 90;\n                    if (ang > 180) ang -= 360;\n                    if (Math.abs(ang) < 4) ang = 0;\n                    L.rotation = Math.round(ang);\n                }\n            }\n            renderCanvas();\n        }\n\n        async function addPipFromFile(file) {\n            if (!isImageLoaded) { showToast('Open a base photo first'); return; }\n            if (!file || !file.type.startsWith('image/')) { showToast('Please pick an image'); return; }\n            try {\n                let img = await loadImageFromBlob(file), blob = file;\n                const m = Math.max(img.naturalWidth, img.naturalHeight);\n                if (m > 2400) {\n                    const s = 2400 / m, c = document.createElement('canvas');\n                    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);\n                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n                    blob = await canvasToBlob(c, file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', 0.92);\n                    img = await loadImageFromBlob(blob);\n                }\n                const imageId = 'pi_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);\n                pipImages[imageId] = { img, blob };\n                const L = Object.assign({ id: 'pip_' + Date.now(), imageId, name: (file.name || 'Image').replace(/\\.[^.]+$/, '').slice(0, 24), x: 0.5, y: 0.5, scale: 0.4, rotation: 0, visible: true }, pipLook());\n                state.pipLayers.push(L);\n                selectedPipId = L.id;\n                if (activeTab !== 'pip') document.querySelector('.tool-tab-btn[data-tab=\"pip\"]').click();\n                renderPipPanelUI();\n                renderCanvas();\n                pushHistory('Added PIP');\n                showToast('PIP added 🖼️');\n            } catch (err) { showToast('Could not read that image'); }\n        }\n\n        function removePip(id) {\n            state.pipLayers = state.pipLayers.filter(l => l.id !== id);\n            if (selectedPipId === id) selectedPipId = null;\n            renderPipPanelUI(); renderCanvas(); pushHistory('Removed PIP');\n        }\n\n        function renderPipPanelUI() {\n            const list = $('pipList'), ed = $('pipEditor');\n            if (!list || !ed) return;\n            const ls = state.pipLayers;\n            if (selectedPipId && !ls.some(l => l.id === selectedPipId)) selectedPipId = null;\n            list.innerHTML = ls.length ? '' : '<p class=\"text-xs text-studio-400 italic py-2\">No PIP images yet.</p>';\n            for (let i = ls.length - 1; i >= 0; i--) {\n                const L = ls[i], sel = L.id === selectedPipId;\n                const row = document.createElement('div');\n                row.dataset.id = L.id;\n                row.className = `flex items-center justify-between gap-1 px-2 py-1.5 rounded-lg border text-xs cursor-pointer transition ${sel ? 'bg-studio-800 border-white text-white' : 'bg-studio-950 border-studio-800 text-studio-300'} ${L.visible === false ? 'opacity-60' : ''}`;\n                const src = pipImages[L.imageId] ? pipImages[L.imageId].img.src : '';\n                row.innerHTML = `<div class=\"flex items-center gap-2 min-w-0\" data-act=\"select\"><img src=\"${src}\" class=\"w-7 h-7 rounded object-cover border border-studio-700 shrink-0\"><span class=\"truncate font-medium\">${escapeHtml(L.name)}</span></div>\n                    <div class=\"flex items-center shrink-0\">\n                    <button data-act=\"up\" class=\"p-1 text-studio-400 hover:text-white\"><i data-lucide=\"arrow-up\" class=\"w-3.5 h-3.5 pointer-events-none\"></i></button>\n                    <button data-act=\"down\" class=\"p-1 text-studio-400 hover:text-white\"><i data-lucide=\"arrow-down\" class=\"w-3.5 h-3.5 pointer-events-none\"></i></button>\n                    <button data-act=\"vis\" class=\"p-1 text-studio-400 hover:text-white\"><i data-lucide=\"${L.visible === false ? 'eye-off' : 'eye'}\" class=\"w-3.5 h-3.5 pointer-events-none\"></i></button>\n                    <button data-act=\"del\" class=\"p-1 text-studio-400 hover:text-red-400\"><i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5 pointer-events-none\"></i></button></div>`;\n                list.appendChild(row);\n            }\n            const L = ls.find(l => l.id === selectedPipId);\n            if (!L) { ed.innerHTML = ls.length ? '<p class=\"text-[11px] text-studio-400\">Tap a PIP above or on the canvas to edit it.</p>' : ''; lucide.createIcons(); return; }\n            const slider = (label, attr, min, max, val, unit, mul) => `<div data-row><div class=\"flex justify-between text-xs mb-1.5\"><span class=\"text-studio-400\">${label}</span><span class=\"pv font-mono text-white\">${val}${unit}</span></div><input type=\"range\" ${attr} data-u=\"${unit}\" ${mul ? `data-mul=\"${mul}\"` : ''} min=\"${min}\" max=\"${max}\" value=\"${val}\" class=\"studio-slider\"></div>`;\n            const seg = (items, cur, key) => `<div class=\"grid grid-cols-${items.length} gap-1\">${items.map(([v, n]) => `<button type=\"button\" data-${key}=\"${v}\" class=\"py-1.5 rounded-lg text-[11px] border transition ${cur === v ? 'bg-white text-studio-950 font-semibold border-white' : 'bg-studio-950 text-studio-300 border-studio-700'}\">${n}</button>`).join('')}</div>`;\n            ed.innerHTML = `<div class=\"p-3 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                <div class=\"text-xs font-semibold text-white truncate\">Editing: ${escapeHtml(L.name)}</div>\n                ${slider('Size', 'data-k=\"scale\"', 5, 300, Math.round(L.scale * 100), '%', 0.01)}\n                ${slider('Rotation', 'data-k=\"rotation\"', -180, 180, L.rotation, '°')}\n                ${slider('Opacity', 'data-k=\"opacity\"', 5, 100, L.opacity, '%')}\n                <div class=\"grid grid-cols-2 gap-1\"><button type=\"button\" data-flip=\"flipH\" class=\"py-1.5 rounded-lg text-[11px] border ${L.flipH ? 'bg-white text-studio-950 border-white' : 'bg-studio-950 text-studio-300 border-studio-700'}\">Flip Horiz</button><button type=\"button\" data-flip=\"flipV\" class=\"py-1.5 rounded-lg text-[11px] border ${L.flipV ? 'bg-white text-studio-950 border-white' : 'bg-studio-950 text-studio-300 border-studio-700'}\">Flip Vert</button></div>\n                <div><label class=\"block text-[10px] text-studio-400 mb-1\">Shape</label>${seg([['rect', 'Rectangle'], ['rounded', 'Rounded'], ['circle', 'Circle']], L.shape, 'shape')}</div>\n                ${L.shape === 'rounded' ? slider('Corner roundness', 'data-k=\"round\"', 5, 50, L.round, '%') : ''}\n                <div><label class=\"block text-[10px] text-studio-400 mb-1\">Blend mode</label><select data-blend class=\"w-full px-2.5 py-1.5 rounded-lg bg-studio-950 border border-studio-700 text-xs text-white focus:outline-none\">${blendHtml(L.blend)}</select></div>\n            </div>\n            <div class=\"p-3 rounded-xl bg-studio-850 border border-studio-800 space-y-3\">\n                <div class=\"text-[11px] font-mono uppercase tracking-wider text-studio-400\">PIP colour &amp; light</div>\n                ${PIP_ADJ.map(([k, n, mn, mx, , u]) => slider(n, `data-adj=\"${k}\"`, mn, mx, L.adj[k], u)).join('')}\n                <button type=\"button\" id=\"pipResetLook\" class=\"w-full py-2 rounded-lg bg-studio-950 hover:bg-studio-800 border border-studio-700 text-white text-xs font-medium transition\">Reset this PIP's look</button>\n            </div>`;\n            lucide.createIcons();\n        }\n\n        function bindExtras() {\n            // fonts\n            $('fontFileInput').addEventListener('change', (e) => { if (e.target.files[0]) handleFontFile(e.target.files[0]); e.target.value = ''; });\n\n            // brush: blend + erase\n            $('brushBlendSelect').innerHTML = blendHtml('source-over');\n            $('brushBlendSelect').addEventListener('change', (e) => { brushBlend = e.target.value; });\n            const setBrushMode = (mode) => {\n                brushMode = mode;\n                brushErase = mode === 'erase';\n                const on = 'py-1.5 rounded-lg text-[11px] font-semibold bg-white text-studio-950 transition';\n                const off = 'py-1.5 rounded-lg text-[11px] font-medium text-studio-400 hover:text-white transition';\n                $('brushModePaintBtn').className = mode === 'paint' ? on : off;\n                $('brushModeShapesBtn').className = mode === 'shapes' ? on : off;\n                $('brushModeEraseBtn').className = mode === 'erase' ? on : off;\n                $('brushShapesOptions').classList.toggle('hidden', mode !== 'shapes');\n                $('brushBlendRow').classList.toggle('hidden', mode !== 'paint');\n                $('brushEraseNote').classList.toggle('hidden', mode !== 'erase');\n                if (mode !== 'shapes') { selectedShapeIndex = -1; shapeDrag = null; }\n                renderCanvas();\n            };\n            $('brushModePaintBtn').addEventListener('click', () => setBrushMode('paint'));\n            $('brushModeShapesBtn').addEventListener('click', () => setBrushMode('shapes'));\n            $('brushModeEraseBtn').addEventListener('click', () => setBrushMode('erase'));\n            $('brushShapeSelect').addEventListener('change', e => { brushShapeType = e.target.value; });\n            const setShapeStyle = fill => {\n                brushShapeFill = fill;\n                $('brushShapeStrokeBtn').className = fill ? 'py-1.5 rounded-md text-[11px] text-studio-400' : 'py-1.5 rounded-md text-[11px] font-semibold bg-white text-studio-950';\n                $('brushShapeFillBtn').className = fill ? 'py-1.5 rounded-md text-[11px] font-semibold bg-white text-studio-950' : 'py-1.5 rounded-md text-[11px] text-studio-400';\n            };\n            $('brushShapeStrokeBtn').addEventListener('click', () => setShapeStyle(false));\n            $('brushShapeFillBtn').addEventListener('click', () => setShapeStyle(true));\n            $('brushHexColor').addEventListener('change', e => {\n                const v = e.target.value.trim();\n                if (/^#[0-9a-fA-F]{6}$/.test(v)) setBrushColor(v.toLowerCase());\n                else { e.target.value = brushColor.toUpperCase(); }\n            });\n            $('brushPickColorBtn').addEventListener('click', () => {\n                isPickingBrushColor = true;\n                $('brushPickColorNote').classList.remove('hidden');\n                $('brushPickColorBtn').classList.add('border-cyan-400','text-cyan-300');\n            });\n\n            // compare: always release\n            ['touchcancel', 'blur'].forEach(ev => window.addEventListener(ev, () => {\n                if (isComparingOriginal) { isComparingOriginal = false; $('compareBadge').classList.add('hidden'); renderCanvas(); }\n            }));\n\n            // PIP\n            $('pipFileInput').addEventListener('change', (e) => { if (e.target.files[0]) addPipFromFile(e.target.files[0]); e.target.value = ''; });\n            const sel = () => state.pipLayers.find(l => l.id === selectedPipId);\n            $('pipList').addEventListener('click', (e) => {\n                const row = e.target.closest('[data-id]');\n                if (!row) return;\n                const id = row.dataset.id, act = (e.target.closest('[data-act]') || {}).dataset?.act || 'select';\n                const i = state.pipLayers.findIndex(l => l.id === id);\n                if (act === 'del') { removePip(id); return; }\n                if (act === 'vis') { state.pipLayers[i].visible = state.pipLayers[i].visible === false; renderPipPanelUI(); renderCanvas(); pushHistory('Toggled PIP'); return; }\n                if (act === 'up' || act === 'down') {\n                    const j = act === 'up' ? i + 1 : i - 1;\n                    if (j < 0 || j >= state.pipLayers.length) return;\n                    [state.pipLayers[i], state.pipLayers[j]] = [state.pipLayers[j], state.pipLayers[i]];\n                    renderPipPanelUI(); renderCanvas(); pushHistory('Reordered PIP'); return;\n                }\n                selectedPipId = id; renderPipPanelUI(); renderCanvas();\n            });\n            const ed = $('pipEditor');\n            ed.addEventListener('input', (e) => {\n                const el = e.target, L = sel();\n                if (!L) return;\n                if (el.dataset.k) L[el.dataset.k] = Number(el.value) * (Number(el.dataset.mul) || 1);\n                else if (el.dataset.adj) L.adj[el.dataset.adj] = Number(el.value);\n                else return;\n                el.closest('[data-row]').querySelector('.pv').textContent = el.value + (el.dataset.u || '');\n                renderCanvas();\n            });\n            ed.addEventListener('change', (e) => {\n                const el = e.target, L = sel();\n                if (!L) return;\n                if (el.dataset.blend !== undefined) { L.blend = el.value; renderCanvas(); pushHistory('PIP Blend'); }\n                else if (el.dataset.k || el.dataset.adj) pushHistory('Edited PIP');\n            });\n            ed.addEventListener('click', (e) => {\n                const b = e.target.closest('button'), L = sel();\n                if (!b || !L) return;\n                if (b.dataset.shape) L.shape = b.dataset.shape;\n                else if (b.dataset.flip) L[b.dataset.flip] = !L[b.dataset.flip];\n                else if (b.id === 'pipResetLook') Object.assign(L, pipLook());\n                else return;\n                renderPipPanelUI(); renderCanvas(); pushHistory('Edited PIP');\n            });\n        }\n\n        // ================= DRAFTS (saved per image in IndexedDB) =================\n        const DB_NAME = 'studio_photo_editor_db';\n        let dbPromise = null;\n        let drafts = [];\n        let currentDraftId = null;\n        let savedBaseBlob = null;\n        let draftSaveTimer = null;\n        let skipNextAutosave = false;\n        let draftErrorShown = false;\n        let batchImageItems = [];\n        let batchActiveIndex = 0;\n        let isBatchDraft = false;\n\n        function openDB() {\n            if (dbPromise) return dbPromise;\n            dbPromise = new Promise((resolve, reject) => {\n                if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }\n                const req = indexedDB.open(DB_NAME, 1);\n                req.onupgradeneeded = () => {\n                    const db = req.result;\n                    if (!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts', { keyPath: 'id' });\n                    if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');\n                };\n                req.onsuccess = () => resolve(req.result);\n                req.onerror = () => reject(req.error);\n            });\n            return dbPromise;\n        }\n\n        async function dbGetAllDrafts() {\n            const db = await openDB();\n            return new Promise((resolve, reject) => {\n                const req = db.transaction('drafts', 'readonly').objectStore('drafts').getAll();\n                req.onsuccess = () => resolve(req.result || []);\n                req.onerror = () => reject(req.error);\n            });\n        }\n\n        async function dbPutDraft(meta, baseBlob, origBlob, extra) {\n            const db = await openDB();\n            return new Promise((resolve, reject) => {\n                const tx = db.transaction(['drafts', 'blobs'], 'readwrite');\n                tx.objectStore('drafts').put(meta);\n                if (baseBlob) tx.objectStore('blobs').put(baseBlob, meta.id + ':base');\n                if (origBlob) tx.objectStore('blobs').put(origBlob, meta.id + ':orig');\n                if (extra) Object.entries(extra).forEach(([k, b]) => tx.objectStore('blobs').put(b, k));\n                tx.oncomplete = () => resolve();\n                tx.onerror = () => reject(tx.error);\n                tx.onabort = () => reject(tx.error);\n            });\n        }\n\n        async function dbGetBlobs(id) {\n            const db = await openDB();\n            const get = (key) => new Promise((resolve, reject) => {\n                const req = db.transaction('blobs', 'readonly').objectStore('blobs').get(key);\n                req.onsuccess = () => resolve(req.result || null);\n                req.onerror = () => reject(req.error);\n            });\n            return { base: await get(id + ':base'), orig: await get(id + ':orig') };\n        }\n\n        async function dbGetBlob(key) {\n            const db = await openDB();\n            return new Promise((resolve, reject) => {\n                const r = db.transaction('blobs', 'readonly').objectStore('blobs').get(key);\n                r.onsuccess = () => resolve(r.result || null);\n                r.onerror = () => reject(r.error);\n            });\n        }\n\n        async function dbPutBlobRaw(key, val) {\n            const db = await openDB();\n            return new Promise((resolve, reject) => {\n                const tx = db.transaction('blobs', 'readwrite');\n                tx.objectStore('blobs').put(val, key);\n                tx.oncomplete = () => resolve();\n                tx.onerror = () => reject(tx.error);\n            });\n        }\n\n        async function dbDeleteDraft(id, pipIds = []) {\n            const db = await openDB();\n            return new Promise((resolve, reject) => {\n                const tx = db.transaction(['drafts', 'blobs'], 'readwrite');\n                tx.objectStore('drafts').delete(id);\n                tx.objectStore('blobs').delete(id + ':base');\n                tx.objectStore('blobs').delete(id + ':orig');\n                pipIds.forEach(p => tx.objectStore('blobs').delete(id + ':pip:' + p));\n                tx.oncomplete = () => resolve();\n                tx.onerror = () => reject(tx.error);\n            });\n        }\n\n        async function dbClearAllDrafts() {\n            const db = await openDB();\n            return new Promise((resolve, reject) => {\n                const tx = db.transaction(['drafts', 'blobs'], 'readwrite');\n                tx.objectStore('drafts').clear();\n                // Blob keys include base/original images, PIP layers, and every batch image.\n                tx.objectStore('blobs').clear();\n                tx.oncomplete = () => resolve();\n                tx.onerror = () => reject(tx.error);\n            });\n        }\n\n        function makeThumb() {\n            const was = hideSelection; hideSelection = true; renderCanvas();\n            const out = makeThumbRaw();\n            hideSelection = was; renderCanvas();\n            return out;\n        }\n\n        function makeThumbRaw() {\n            const maxDim = 200;\n            const scale = Math.min(1, maxDim / Math.max(canvas.width, canvas.height));\n            const t = document.createElement('canvas');\n            t.width = Math.max(1, Math.round(canvas.width * scale));\n            t.height = Math.max(1, Math.round(canvas.height * scale));\n            const tctx = t.getContext('2d');\n            tctx.fillStyle = '#18181c';\n            tctx.fillRect(0, 0, t.width, t.height);\n            tctx.drawImage(canvas, 0, 0, t.width, t.height);\n            return t.toDataURL('image/jpeg', 0.72);\n        }\n\n        async function saveDraftNow() {\n            clearTimeout(draftSaveTimer);\n            if (!currentDraftId || !isImageLoaded) return;\n            const d = drafts.find(x => x.id === currentDraftId);\n            if (!d) return;\n            try {\n                const batchMode = !!(d.batchImages && d.batchImages.length);\n                const baseBlob = batchMode ? null : (sourceImage._blob || await imageToBlob(sourceImage));\n                if (!batchMode) sourceImage._blob = baseBlob;\n                const baseChanged = !batchMode && baseBlob !== savedBaseBlob;\n                const origBlob = batchMode ? null : (d.origSaved ? null : (originalImage && originalImage._blob) || baseBlob);\n                if (!isComparingOriginal) d.thumb = makeThumb();\n                d.updatedAt = Date.now();\n                d.width = sourceImage.naturalWidth || sourceImage.width;\n                d.height = sourceImage.naturalHeight || sourceImage.height;\n                d.state = JSON.parse(JSON.stringify(state));\n                if (origBlob) d.origSaved = true;\n                const extra = {};\n                d.pipIds = d.pipIds || [];\n                new Set(state.pipLayers.map(l => l.imageId)).forEach(pid => {\n                    const rec = pipImages[pid], key = `${d.id}:pip:${pid}`;\n                    if (rec && !savedPipKeys.has(key)) extra[key] = rec.blob;\n                    if (!d.pipIds.includes(pid)) d.pipIds.push(pid);\n                });\n                if (batchMode) {\n                    d.batchActiveIndex = batchActiveIndex;\n                    batchImageItems.forEach((item, i) => { if (item && item.blob) extra[`${d.id}:batch:${i}`] = item.blob; });\n                }\n                await dbPutDraft(d, baseChanged ? baseBlob : null, origBlob, extra);\n                Object.keys(extra).forEach(k => savedPipKeys.add(k));\n                if (!batchMode) savedBaseBlob = baseBlob;\n                drafts.sort((a, b) => b.updatedAt - a.updatedAt);\n                renderDraftsUI();\n            } catch (err) {\n                if (!draftErrorShown) {\n                    draftErrorShown = true;\n                    showToast('Could not save draft: browser storage unavailable');\n                }\n            }\n        }\n\n        function scheduleDraftSave() {\n            if (skipNextAutosave) { skipNextAutosave = false; return; }\n            if (!currentDraftId) return;\n            clearTimeout(draftSaveTimer);\n            draftSaveTimer = setTimeout(saveDraftNow, 700);\n        }\n\n        function timeAgo(ts) {\n            const sec = Math.max(1, Math.round((Date.now() - ts) / 1000));\n            if (sec < 60) return 'just now';\n            const min = Math.round(sec / 60);\n            if (min < 60) return `${min}m ago`;\n            const hr = Math.round(min / 60);\n            if (hr < 24) return `${hr}h ago`;\n            return `${Math.round(hr / 24)}d ago`;\n        }\n\n        function escapeHtml(str) {\n            return String(str).replace(/[&<>\"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[ch]));\n        }\n\n        function updateEmptyState() {\n            document.getElementById('emptyState').classList.toggle('hidden', isImageLoaded);\n            document.getElementById('canvasWrapper').classList.toggle('hidden', !isImageLoaded);\n        }\n\n        function openDraftsSidebar() {\n            const sidebar = document.getElementById('draftsSidebar');\n            sidebar.classList.add('is-open');\n            sidebar.setAttribute('aria-hidden', 'false');\n            document.getElementById('draftsBackdrop').classList.remove('hidden');\n            renderDraftsUI();\n        }\n\n        function closeDraftsSidebar() {\n            const sidebar = document.getElementById('draftsSidebar');\n            sidebar.classList.remove('is-open');\n            sidebar.setAttribute('aria-hidden', 'true');\n            document.getElementById('draftsBackdrop').classList.add('hidden');\n        }\n\n        function renderDraftsUI() {\n            const list = document.getElementById('draftsList');\n            const badge = document.getElementById('draftsCountBadge');\n            if (!list) return;\n            badge.textContent = drafts.length;\n            badge.classList.toggle('hidden', drafts.length === 0);\n            document.getElementById('draftsSummary').textContent = `${drafts.length} ${drafts.length === 1 ? 'draft' : 'drafts'}`;\n\n            if (!drafts.length) {\n                list.innerHTML = `<div class=\"p-5 rounded-xl bg-studio-950/60 border border-studio-800 text-center space-y-2\">\n                    <div class=\"mx-auto w-9 h-9 rounded-full bg-studio-800 flex items-center justify-center\"><i data-lucide=\"image\" class=\"w-4 h-4 text-studio-300\"></i></div>\n                    <div class=\"text-xs font-semibold text-studio-200\">No drafts yet</div>\n                    <p class=\"text-[11px] text-studio-400 leading-relaxed\">Open a photo to start editing. Your progress saves automatically.</p></div>`;\n                lucide.createIcons();\n                return;\n            }\n\n            const activeDraft = drafts.find(d => d.id === currentDraftId);\n            const otherDrafts = drafts.filter(d => d.id !== currentDraftId);\n            const cardMarkup = (d, active = false) => `\n                <div class=\"draft-card group p-2.5 rounded-xl border transition flex items-center gap-3 cursor-pointer ${active ? 'bg-studio-800 border-studio-500 ring-1 ring-white/10' : 'bg-studio-950/50 hover:bg-studio-800 border-studio-800'}\" data-draft-id=\"${d.id}\">\n                    <div class=\"w-12 h-12 rounded-lg overflow-hidden shrink-0 canvas-checkerboard border border-studio-700/80 flex items-center justify-center\">\n                        ${d.thumb ? `<img src=\"${d.thumb}\" alt=\"\" class=\"w-full h-full object-cover\">` : '<i data-lucide=\"image\" class=\"w-4 h-4 text-studio-500\"></i>'}\n                    </div>\n                    <div class=\"min-w-0 flex-1\">\n                        <div class=\"draft-name text-xs font-semibold ${active ? 'text-white' : 'text-studio-200'} truncate\" title=\"${active ? 'Click to rename' : 'Open draft'}\">${escapeHtml(d.name)}</div>\n                        <div class=\"text-[10px] text-studio-400 mt-1 truncate\">${d.width || '?'} × ${d.height || '?'} <span class=\"text-studio-600\">·</span> ${timeAgo(d.updatedAt)}</div>\n                        ${active ? '<div class=\"text-[10px] text-emerald-400 mt-1 flex items-center gap-1\"><span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400\"></span>Currently editing</div>' : ''}\n                    </div>\n                    <button class=\"draft-del-btn p-2 rounded-lg hover:bg-red-950/60 text-studio-500 hover:text-red-400 transition shrink-0\" title=\"Delete draft\"><i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"></i></button>\n                </div>`;\n\n            list.innerHTML = `${activeDraft ? `<div class=\"space-y-2\"><div class=\"px-1 text-[10px] font-semibold uppercase tracking-wider text-studio-500\">Working on</div>${cardMarkup(activeDraft, true)}</div>` : `<div class=\"p-3 rounded-xl border border-dashed border-studio-700 text-xs text-studio-400\">No draft selected. Choose one below or open a photo.</div>`}\n                ${otherDrafts.length ? `<details class=\"group mt-4\" ${!activeDraft ? 'open' : ''}><summary class=\"flex items-center justify-between cursor-pointer list-none px-1 py-2 text-[10px] font-semibold uppercase tracking-wider text-studio-400 hover:text-white\"><span>Other drafts</span><span class=\"flex items-center gap-2 normal-case tracking-normal font-normal\"><span>${otherDrafts.length}</span><i data-lucide=\"chevron-down\" class=\"w-3.5 h-3.5 transition-transform group-open:rotate-180\"></i></span></summary><div class=\"space-y-2 pt-1\">${otherDrafts.map(d => cardMarkup(d, false)).join('')}</div></details>` : ''}`;\n\n            list.querySelectorAll('.draft-card').forEach(card => {\n                const id = card.dataset.draftId;\n                const d = drafts.find(item => item.id === id);\n                const active = id === currentDraftId;\n                card.addEventListener('click', e => {\n                    if (e.target.closest('.draft-del-btn') || e.target.closest('.draft-name-input')) return;\n                    if (e.target.closest('.draft-name') && active) return;\n                    openDraft(id);\n                });\n                const nameEl = card.querySelector('.draft-name');\n                nameEl.addEventListener('click', e => {\n                    if (!active) return;\n                    e.stopPropagation();\n                    const input = document.createElement('input');\n                    input.type = 'text'; input.value = d.name;\n                    input.className = 'draft-name-input w-full px-2 py-1 rounded-lg bg-studio-950 border border-studio-600 text-xs text-white focus:outline-none focus:border-white';\n                    nameEl.replaceWith(input); input.focus(); input.select();\n                    let finished = false;\n                    const finish = async () => {\n                        if (finished) return; finished = true;\n                        const v = input.value.trim(); if (v) d.name = v.slice(0, 60);\n                        try { await dbPutDraft(d, null, null); } catch (err) { /* ignore */ }\n                        renderDraftsUI();\n                    };\n                    input.addEventListener('blur', finish);\n                    input.addEventListener('keydown', ev => { if (ev.key === 'Enter') input.blur(); if (ev.key === 'Escape') { input.value = d.name; input.blur(); } });\n                });\n                const delBtn = card.querySelector('.draft-del-btn');\n                let armed = false;\n                delBtn.addEventListener('click', e => {\n                    e.stopPropagation();\n                    if (!armed) {\n                        armed = true; delBtn.classList.add('bg-red-950/80', 'text-red-300');\n                        showToast('Tap delete again to confirm');\n                        setTimeout(() => { armed = false; delBtn.classList.remove('bg-red-950/80', 'text-red-300'); }, 2500);\n                        return;\n                    }\n                    deleteDraft(id);\n                });\n            });\n            lucide.createIcons();\n        }\n\n        async function openDraft(id) {\n            if (id === currentDraftId) { closeDraftsSidebar(); return; }\n            await saveDraftNow();\n            const d = drafts.find(x => x.id === id);\n            if (!d) return;\n            try {\n                const blobs = await dbGetBlobs(id);\n                if (!blobs.base) throw new Error('Saved image data is missing');\n                isBatchDraft = !!(d.batchImages && d.batchImages.length);\n                batchImageItems = [];\n                batchActiveIndex = Math.max(0, Math.min((d.batchActiveIndex || 0), (d.batchImages || []).length - 1));\n                if (isBatchDraft) {\n                    for (let i = 0; i < d.batchImages.length; i++) {\n                        const b = await dbGetBlob(`${id}:batch:${i}`);\n                        const blob = b || (i === 0 ? blobs.base : null);\n                        if (!blob) continue;\n                        const image = await loadImageFromBlob(blob);\n                        image._blob = blob;\n                        batchImageItems.push({ name: d.batchImages[i].name || `Image ${i + 1}`, blob, img: image });\n                    }\n                    if (!batchImageItems.length) throw new Error('Batch images are missing');\n                    batchActiveIndex = Math.min(batchActiveIndex, batchImageItems.length - 1);\n                } else {\n                    batchImageItems = [];\n                    batchActiveIndex = 0;\n                }\n                const img = isBatchDraft ? batchImageItems[batchActiveIndex].img : await loadImageFromBlob(blobs.base);\n                const orig = isBatchDraft ? img : (blobs.orig ? await loadImageFromBlob(blobs.orig) : img);\n                const fresh = createDefaultState();\n                const saved = d.state || {};\n                state = Object.assign(fresh, saved);\n                state.adjustments = Object.assign(createDefaultState().adjustments, saved.adjustments || {});\n                state.transform = Object.assign(createDefaultState().transform, saved.transform || {});\n                state.textLayers = saved.textLayers || [];\n                state.brushStrokes = saved.brushStrokes || [];\n                state.pipLayers = saved.pipLayers || [];\n                pipImages = {}; savedPipKeys = new Set(); selectedPipId = null;\n                for (const pid of new Set(state.pipLayers.map(l => l.imageId))) {\n                    try {\n                        const pb = await dbGetBlob(`${id}:pip:${pid}`);\n                        if (pb) { pipImages[pid] = { img: await loadImageFromBlob(pb), blob: pb }; savedPipKeys.add(`${id}:pip:${pid}`); }\n                    } catch (e) { /* skip */ }\n                }\n                state.pipLayers = state.pipLayers.filter(l => pipImages[l.imageId]);\n                sourceImage = img;\n                originalImage = orig;\n                isImageLoaded = true;\n                historyStack = [];\n                historyIndex = -1;\n                selectedTextLayerId = null;\n                currentDraftId = id;\n                savedBaseBlob = blobs.base;\n                renderBatchPhotoList();\n                updateEmptyState();\n                syncUIFromState();\n                renderCanvas();\n                skipNextAutosave = true;\n                pushHistory('Opened Draft');\n                skipNextAutosave = false;\n                renderDraftsUI();\n                closeDraftsSidebar();\n                showToast(`Opened \"${d.name}\"`);\n            } catch (err) {\n                showToast(err.message || 'Could not open draft');\n            }\n        }\n\n        async function deleteDraft(id) {\n            try { await dbDeleteDraft(id, (drafts.find(x => x.id === id) || {}).pipIds || []); } catch (err) { showToast('Could not delete draft'); return; }\n            drafts = drafts.filter(x => x.id !== id);\n            if (id === currentDraftId) {\n                clearTimeout(draftSaveTimer);\n                currentDraftId = null;\n                savedBaseBlob = null;\n                isImageLoaded = false;\n                sourceImage = new Image();\n                originalImage = null;\n                pipImages = {}; savedPipKeys = new Set(); selectedPipId = null;\n                batchImageItems = []; batchActiveIndex = 0; isBatchDraft = false; renderBatchPhotoList();\n                state = createDefaultState();\n                historyStack = [];\n                historyIndex = -1;\n                selectedTextLayerId = null;\n                updateEmptyState();\n                syncUIFromState();\n            }\n            renderDraftsUI();\n            showToast('Draft deleted');\n        }\n\n        async function clearAllDrafts() {\n            clearTimeout(draftSaveTimer);\n            try {\n                await dbClearAllDrafts();\n                drafts = [];\n                currentDraftId = null;\n                savedBaseBlob = null;\n                isImageLoaded = false;\n                sourceImage = new Image();\n                originalImage = null;\n                pipImages = {}; savedPipKeys = new Set(); selectedPipId = null;\n                batchImageItems = []; batchActiveIndex = 0; isBatchDraft = false;\n                renderBatchPhotoList();\n                state = createDefaultState();\n                historyStack = [];\n                historyIndex = -1;\n                selectedTextLayerId = null;\n                isBrushEnabled = false;\n                isPickingBgColor = false;\n                updateEmptyState();\n                syncUIFromState();\n                renderCanvas();\n                renderDraftsUI();\n                updateInteractiveModeHUD();\n                showToast('All single and batch drafts cleared');\n            } catch (err) {\n                showToast('Could not clear drafts');\n            }\n        }\n\n        async function initDrafts() {\n            try {\n                drafts = (await dbGetAllDrafts()).sort((a, b) => b.updatedAt - a.updatedAt);\n            } catch (err) {\n                drafts = [];\n            }\n            renderDraftsUI();\n            if (drafts.length) await openDraft(drafts[0].id);\n            else updateEmptyState();\n        }\n\n        function bindDrafts() {\n            document.getElementById('draftsToggleBtn').addEventListener('click', openDraftsSidebar);\n            document.getElementById('closeDraftsBtn').addEventListener('click', closeDraftsSidebar);\n            const clearBtn = document.getElementById('clearAllDraftsBtn');\n            let clearArmedTimer = null;\n            clearBtn.addEventListener('click', () => {\n                if (clearBtn.dataset.armed === 'true') {\n                    clearTimeout(clearArmedTimer);\n                    clearBtn.dataset.armed = 'false';\n                    clearBtn.classList.remove('bg-red-950/80', 'text-red-300');\n                    clearAllDrafts();\n                    return;\n                }\n                clearBtn.dataset.armed = 'true';\n                clearBtn.classList.add('bg-red-950/80', 'text-red-300');\n                showToast('Double-click to clear all drafts');\n                clearArmedTimer = setTimeout(() => {\n                    clearBtn.dataset.armed = 'false';\n                    clearBtn.classList.remove('bg-red-950/80', 'text-red-300');\n                }, 900);\n            });\n            document.getElementById('draftsBackdrop').addEventListener('click', closeDraftsSidebar);\n            window.addEventListener('beforeunload', () => { if (currentDraftId) saveDraftNow(); });\n            document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraftNow(); });\n        }\n\n        function buildSlidersUI() {\n            const container = document.getElementById('slidersContainer');\n            container.innerHTML = '';\n\n            ADJUSTMENT_CONFIG.forEach(cfg => {\n                const val = state.adjustments[cfg.key];\n                const row = document.createElement('div');\n                row.className = 'space-y-1.5';\n                row.innerHTML = `\n                    <div class=\"flex items-center justify-between text-xs\">\n                        <label for=\"slider-${cfg.key}\" class=\"text-studio-400 font-medium\">${cfg.label}</label>\n                        <button data-reset-key=\"${cfg.key}\" class=\"slider-val-btn font-mono text-[11px] text-studio-200 hover:text-white\" title=\"Click to reset\">\n                            <span id=\"val-${cfg.key}\">${val}${cfg.unit}</span>\n                        </button>\n                    </div>\n                    <input id=\"slider-${cfg.key}\" data-key=\"${cfg.key}\" type=\"range\" min=\"${cfg.mi n tool\">\n                            <div class=\"w-7 h-7 rounded-lg bg-studio-900 border border-studio-700 flex items-center justify-center shrink-0\">\n                                ${swatchHtml}\n                            </div>\n                            <div class=\"min-w-0 flex-1\">\n                                <div class=\"text-xs font-semibold truncate\">${item.title}</div>\n                                <div class=\"text-[10px] font-mono text-studio-400 truncate\">${item.subtitle}</div>\n                            </div>\n                        </div>\n                        <div class=\"flex items-center gap-1 shrink-0\">\n                            ${item.noToggle ? '' : `<button class=\"layer-vis-btn p-1.5 rounded-lg hover:bg-studio-700 text-studio-300 hover:text-white transition\">\n                                <i data-lucide=\"${item.visible ? 'eye' : 'eye-off'}\" class=\"w-3.5 h-3.5\"></i>\n                            </button>`}\n                            ${item.noDelete ? '' : `<button class=\"layer-del-btn p-1.5 rounded-lg hover:bg-red-950/60 text-studio-400 hover:text-red-400 transition\" title=\"${item.type === 'tool' ? 'Undo this tool' : 'Remove'}\">\n                                <i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"></i>\n                            </button>`}\n                        </div>\n                    `;\n\n                    card.querySelector('.layer-jump-trigger').addEventListener('click', () => {\n                        if (item.type === 'text') selectedTextLayerId = item.id;\n                        if (item.type === 'pip') selectedPipId = item.id;\n                        document.querySelector(`.tool-tab-btn[data-tab=\"${item.jumpTab}\"]`).click();\n                    });\n\n                    card.querySelector('.layer-vis-btn')?.addEventListener('click', (e) => {\n                        e.stopPropagation();\n                        if (item.type === 'text') {\n                            const t = state.textLayers.find(l => l.id === item.id);\n                            if (t) t.visible = t.visible === false ? true : false;\n                        } else if (item.type === 'pip') {\n                            const p = state.pipLayers.find(l => l.id === item.id);\n                            if (p) p.visible = p.visible === false ? true : false;\n                            renderPipPanelUI();\n                        } else if (item.type === 'brush') {\n                            const s = state.brushStrokes[item.index];\n                            if (s) s.visible = s.visible === false ? true : false;\n                        } else if (item.type === 'adjustment') {\n                            if (!state.disabledAdjustments) state.disabledAdjustments = {};\n                            state.disabledAdjustments[item.key] = !state.disabledAdjustments[item.key];\n                        } else if (item.type === 'transform') {\n                            state.transform.visible = state.transform.visible === false ? true : false;\n                        }\n                        renderLayerStackUI();\n                        renderCanvas();\n                    });\n\n                    card.querySelector('.layer-del-btn')?.addEventListener('click', (e) => {\n                        e.stopPropagation();\n                        if (item.type === 'tool') {\n                            const before = toolOpBefore[item.id];\n                            if (!before) return;\n                            const op = state.toolOps.find(o => o.id === item.id);\n                            sourceImage = before;\n                            state.toolOps = state.toolOps.filter(o => o.id !== item.id);\n                            pushHistory(`Removed ${op ? op.label : 'Tool'}`);\n                        } else if (item.type === 'text') {\n                            state.textLayers = state.textLayers.filter(l => l.id !== item.id);\n                            if (selectedTextLayerId === item.id) selectedTextLayerId = null;\n                            pushHistory(`Removed Text`);\n                        } else if (item.type === 'pip') {\n                            state.pipLayers = state.pipLayers.filter(l => l.id !== item.id);\n                            if (selectedPipId === item.id) selectedPipId = null;\n                            pushHistory('Removed PIP');\n                        } else if (item.type === 'brush') {\n                            state.brushStrokes.splice(item.index, 1);\n                            pushHistory(`Removed Stroke`);\n                        } else if (item.type === 'adjustment') {\n                            const cfg = ADJUSTMENT_CONFIG.find(c => c.key === item.key);\n                            if (cfg) state.adjustments[item.key] = cfg.default;\n                            if (state.disabledAdjustments) delete state.disabledAdjustments[item.key];\n                            pushHistory(`Reset ${cfg.label}`);\n                        } else if (item.type === 'transform') {\n                            state.transform = createDefaultState().transform;\n                            pushHistory('Reset Crop');\n                        }\n                        syncUIFromState();\n                        renderCanvas();\n                    });\n\n                    stackContainer.appendChild(card);\n                });\n            }\n\n            const baseCard = document.createElement('div');\n            baseCard.className = 'p-2.5 rounded-xl bg-studio-950 border border-studio-800 flex items-center justify-between gap-2 text-studio-400';\n            baseCard.innerHTML = `\n                <div class=\"flex items-center gap-2.5 min-w-0\">\n                    <div class=\"w-7 h-7 rounded-lg bg-studio-900 border border-studio-800 flex items-center justify-center shrink-0\">\n                        <i data-lucide=\"image\" class=\"w-3.5 h-3.5 text-studio-400\"></i>\n
